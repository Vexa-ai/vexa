# OSV-Scanner allow list (.github/workflows/cve-scanning.yml). Each entry is a reviewed decision with a
# reason and an expiry: on that date the finding fails the scan again and is re-read. The reasoning in
# full is in security/known-advisories.md.

[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"
ignoreUntil = 2026-12-31
reason = "sprintf-js 1.1.3, DoS through an unbounded precision specifier; no fixed release exists. Reached only through roarr <- global-agent <- onnxruntime-node, which formats its own log lines during the postinstall download of the ONNX runtime; no request data reaches it."

[[IgnoredVulns]]
id = "GHSA-238p-pmpm-9mq7"
ignoreUntil = 2026-12-31
reason = "katex 0.16.47 (LOW): a trust bypass that needs prototype pollution to exist already. Reached through mermaid in the terminal's diagram rendering; the fix is in 0.18.2, outside mermaid 11's ^0.16 range, so it waits for mermaid."

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2026-12-31
reason = "deepmerge 4.3.1, prototype poisoning in mergeObject(); no fixed release exists. Reached only through puppeteer-extra-plugin-user-preferences <- puppeteer-extra-plugin-stealth in the join and remote-browser bots, which merges the stealth plugins' own fixed Chrome preferences; Vexa passes no userPrefs, so no request data reaches it."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-11-18
reason = "minimatch 3.1.5: the advisory's code, firstPhasePreProcess() at optimizationLevel >= 2, does not exist in 3.x, and no 3.x release is fixed (the fix is 11.0.1). Reached only through rimraf 3 <- puppeteer-extra-plugin-user-data-dir in the join and remote-browser bots, which deletes its own temporary profile directory; no pattern comes from a request."
