[project]
name = "vexa-gateway"
version = "0.12.0"
description = "Gateway lane (Group-6) PRODUCTION edge: the v0.12 carve of services/api-gateway/main.py — create_app(authorizer, downstream, redis) builds the REST proxy (fail-closed auth, scope 403, verbatim body passthrough), the /ws multiplex (subscribe/unsubscribe/ping + redis fan-in), and /health. Collaborators are injected as ports so the same app runs with real adapters in prod and injected fakes in tests; the O-API-1 conformance suite drives THIS shipped app."
requires-python = ">=3.11"
dependencies = [
    # FastAPI + Starlette — the gateway app + TraceMiddleware (no network at import time).
    "fastapi>=0.110",
    "starlette>=0.37",
    # TestClient transport for the unit tests (httpx is also the real DownstreamClient runtime).
    "httpx>=0.27",
    "pydantic>=2",
    "pytest>=8",
    # pytest-asyncio drives the /ws multiplex unit tests (asyncio_mode=auto).
    # No SQLAlchemy-async here → no greenlet pin needed.
    "pytest-asyncio>=0.23",
    # fastapi-guard: per-IP rate limiting + auto-IP-ban at the edge (edge_guard.py),
    # and the WS connect guard primitives (check_rate_limit_by_ip / is_ip_allowed /
    # ip_ban_manager, re-exported at guard's top level since 7.7.0). 7.8 is the floor:
    # it declares guard-core>=3.14.0, which carries the WS rate-limit primitive this
    # module drives the /ws path through (3.13.0) plus the hardening on top of it
    # (bounded in-memory stores, Retry-After on every 429, canonicalised ban addresses);
    # 7.8.0 itself joins repeated X-Forwarded-For field lines in its Starlette adapter.
    # Pinned <8.0 so a major bump (which may rename SecurityConfig fields)
    # can't silently break the gateway on a `uv sync --frozen` image rebuild.
    "fastapi-guard>=7.8,<8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
