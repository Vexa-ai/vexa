[project]
name = "vexa-gateway"
version = "0.12.0"
description = "Gateway lane (Group-6) PRODUCTION edge: the v0.12 carve of services/api-gateway/main.py — create_app(authorizer, downstream, redis) builds the REST proxy (fail-closed auth, scope 403, verbatim body passthrough), the /ws multiplex (subscribe/unsubscribe/ping + redis fan-in), and /health. Collaborators are injected as ports so the same app runs with real adapters in prod and injected fakes in tests; the O-API-1 conformance suite drives THIS shipped app."
requires-python = ">=3.11"
dependencies = [
    # FastAPI + Starlette — the gateway app + TraceMiddleware (no network at import time).
    "fastapi>=0.110",
    "starlette>=0.37",
    # TestClient transport for the unit tests (httpx is also the real DownstreamClient runtime).
    "httpx>=0.27",
    "pydantic>=2",
    # fastapi-guard: per-IP rate limiting + auto-IP-ban at the edge (edge_guard.py builds and
    # installs the SecurityConfig / SecurityMiddleware). The /ws path runs the library's own
    # guard_websocket directly (called from run_multiplex in app.py), so no Vexa-authored guard
    # orchestration remains for either path. 7.8.1 is the floor: it declares guard-core>=3.14.0,
    # which carries the WS rate-limit primitive guard_websocket uses (3.13.0) plus the hardening
    # on top of it (bounded in-memory stores, Retry-After on every 429, canonicalised ban
    # addresses); 7.8.0 joins repeated X-Forwarded-For field lines in its Starlette adapter, and
    # 7.8.1 makes a whitelisted IP skip the /ws rate limit like the HTTP path (7.8.0 did not).
    # The lock sits on guard-core 3.15.0, whose rate limiter honors redis_fail_open (the
    # default False now raises on a Redis outage instead of falling back); edge_guard.py sets
    # it True explicitly, so the behavior is the same on either side of that boundary.
    # Pinned <8.0 so a major bump (which may rename SecurityConfig fields) can't silently break
    # the gateway on a `uv sync --frozen` image rebuild.
    "fastapi-guard>=7.8.1,<8.0",
    # guard-core redacts Authorization, Cookie, X-API-Key and query credentials in the request
    # context it logs for every block; 3.x wrote them verbatim.
    "guard-core>=4.4,<5",
    # gateway-identity.v1: the gateway signs the identity it resolved with an Ed25519 private key
    # (OpenSSL through cryptography). Apache-2.0 OR BSD-3-Clause.
    "cryptography>=50.0.1,<51",
    # The bot-account live view: the edge relays /bot-accounts/sessions/{id}/vnc to meeting-api's
    # websocket as a client (vnc_relay.py). Already in the lock through uvicorn[standard].
    "websockets>=15,<18",
]

[dependency-groups]
# Test tooling only: `uv sync --no-dev` (the Dockerfile) keeps it out of the production image.
# pytest-asyncio drives the /ws multiplex unit tests (asyncio_mode=auto).
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# What only the image runs: the ASGI server and the production database/storage clients. Installed
# from the lock with `uv sync --group production` by the Dockerfile and Lite, never `uv pip install`d beside it.
production = ["uvicorn[standard]>=0.34,<1", "redis>=5.2.1,<6", "websockets>=15,<18"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
