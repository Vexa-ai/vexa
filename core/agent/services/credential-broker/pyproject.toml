[project]
name = "vexa-credential-broker"
version = "0.13.2"
description = "The Connections credential broker: holds third-party credentials behind signed role assertions (credential-broker.v1) and uses them on the caller's behalf without returning them."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
    # AES-256-GCM for the local encrypted store (ADR-0040). Apache-2.0 OR BSD-3-Clause.
    "cryptography>=50.0.1,<51",
]

[dependency-groups]
# test runner only — kept out of the image (uv sync --no-dev in the Dockerfile)
dev = ["pytest>=9.0.3", "jsonschema>=4,<5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
