[project]
name = "vexa-admin-api"
version = "0.12.0"
description = "Identity service carve (admin-api: users, scoped tokens, /internal/validate) + the Group-1 backing-stack evals (postgres·redis·admin-api)."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2",
    "redis>=5",
    # AES-256-GCM for the per-user secret envelope (app/field_crypto.py, #876). Apache-2.0 OR
    # BSD-3 (FINOS Category A) and already resolved elsewhere in this tree at the same major
    # (core/meetings/services/mcp/uv.lock pins 50.0.1). The stdlib has no AES.
    "cryptography>=45,<51",
    "testcontainers[postgres,redis]>=4.0",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
