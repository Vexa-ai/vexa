[project]
name = "vexa-admin-api"
version = "0.12.0"
description = "Identity service carve (admin-api: users, scoped tokens, /internal/validate) + the Group-1 backing-stack evals (postgres·redis·admin-api)."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "asyncpg>=0.29",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2",
    "redis>=5",
]

[dependency-groups]
# Test tooling only: `uv sync --no-dev` (the Dockerfile) keeps it out of the production image.
# The stack evals start an ephemeral Postgres + Redis (testcontainers, which brings the docker SDK)
# and converge the schema over a sync psycopg URL; the service itself runs on asyncpg (Apache-2.0).
# psycopg is LGPL-3.0-only, so it must stay here, out of the shipped tree.
dev = ["pytest>=8", "testcontainers[postgres,redis]>=4.0", "psycopg[binary]>=3.1"]
# What only the image runs: the ASGI server and the production database/storage clients. Installed
# from the lock with `uv sync --group production` by the Dockerfile and Lite, never `uv pip install`d beside it.
production = ["uvicorn[standard]>=0.34,<1", "sqlalchemy[asyncio]>=2.0.36,<2.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
