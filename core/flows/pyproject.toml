[project]
name = "vexa-flows"
version = "0.12.0"
description = "The reaction engine — durable product workflows as two Postgres tables and one leased worker loop. A fact enters as a sealed envelope, becomes exactly one reaction row, and every touch of the outside world leaves an effect_receipt."
requires-python = ">=3.11"
# The ENGINE (src/flows/) imports stdlib only — that is its isolation law, checked by
# scripts/check-isolation.js. These are what the steps, the flow definitions and the HTTP
# integrations need, and they are the same wheels the Dockerfile installs.
# The SAME set core/flows/Dockerfile installs, plus pydantic, which the API imports directly.
# psycopg is not optional and not lazy: `postgres_db` (flows/db.py:55) calls `create_engine` on a
# `postgresql+psycopg://` URL, and SQLAlchemy imports the DBAPI right there — so a tree without it
# cannot even IMPORT flows_api, which is how gate:health found this. Under-declaring a dependency
# the image installs is the same defect as declaring one nothing uses; both make the manifest a
# guess. httpx was the latter and is gone — flows reaches services over `urllib` (flows_steps/common).
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2,<3",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
]

[dependency-groups]
# The offline suite: the whole failure matrix runs on stdlib sqlite with a FakeClock and fake
# steps, zero domains attached (README). Postgres is the production dialect, never a test one —
# so this group adds pytest and nothing else.
# `httpx2` is what starlette's TestClient imports on the version this lean dependency set
# resolves to — tests/test_health.py drives the app through it. TEST-ONLY: the Dockerfile
# installs the runtime deps above and never this group, so the shipped image is unchanged.
dev = ["pytest>=8,<10", "httpx2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The same `sys.path` the two entrypoints build for themselves (`sys.path.insert(0, parents[1])` at
# the top of `flows_api` and `flows_worker`): the packages under `src/` are imported by bare name in
# the image, and a suite that reached them any other way would exercise a layout the product has not
# got. `tests` is on it too, for the sqlite double.
pythonpath = ["src", "tests"]
