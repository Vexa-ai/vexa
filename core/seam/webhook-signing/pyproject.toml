[project]
name = "vexa-seam-webhook-signing"
version = "0.12.0"
description = "L3 SEAM proof for the per-user webhook secret: PUT /user/webhook through the REAL gateway into the REAL admin-api (Postgres) → /internal/validate → gateway header injection → REAL meeting-api POST /bots stores it on meeting.data → lifecycle callback delivers meeting.completed over real HTTP to a local receiver, signed with that secret. Admin-api and meeting-api run as real uvicorn servers on loopback; the gateway runs in-process over its production httpx adapters."
requires-python = ">=3.11"
dependencies = [
    # Union of admin-api + gateway + meeting-api runtime/test deps, so all three run in ONE venv.
    "fastapi>=0.110,<1",
    "starlette>=0.37",
    "httpx>=0.27,<1",
    "pydantic>=2",
    "cryptography>=50.0.1,<51",
    "fastapi-guard>=7.2,<8.0",
    "guard-core>=4.4,<5",
    "websockets>=15,<18",
    "pillow>=13,<14",
    "boto3>=1.35,<2",
    "pyjwt[crypto]>=2.10,<3",
    "jsonschema>=4.21,<5",
    "referencing>=0.34,<1",
    "redis>=5,<6",
    "fakeredis>=2.21,<3",
    "croniter>=2,<4",
    "python-multipart>=0.0.9",
    "icalendar>=6,<7",
    "python-dateutil>=2.9,<3",
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "testcontainers[postgres]>=4.0",
    "uvicorn>=0.29",
    "pytest>=8",
    "pytest-asyncio>=0.23,<2",
]

[tool.uv]
package = false
# Every package the services lock is held to a version their own uv.locks use (generated from
# meeting-api, gateway and admin-api uv.lock): the seam proves the services as they ship.
