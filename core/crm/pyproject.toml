[project]
name = "vexa-crm"
version = "0.13.3"
description = "Optional CRM records, source mappings, permissions and revision history"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2,<3", "pg8000>=1.31,<2", "fastapi>=0.110,<1", "uvicorn>=0.29,<1", "pydantic>=2,<3", "httpx>=0.27,<1", "jsonschema>=4,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "jsonschema>=4,<5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
