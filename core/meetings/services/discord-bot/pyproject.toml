[project]
name = "vexa-discord-bot"
version = "0.12.0"
description = "The Discord platform-lane bot (#875): joins a Discord voice channel over the DAVE/E2EE voice-gateway receive path, and speaks invocation.v1 / transcript.v1 / lifecycle.v1 / acts.v1 like every other meeting-bot kind."
requires-python = ">=3.11,<3.12"
dependencies = [
    "py-cord[voice]>=2.8",
    "dave.py>=0.1.2,<0.2",
    "websockets>=13,<14",
    "cryptography>=42",
    "PyNaCl>=1.5,<2",
    "httpx>=0.27,<1",
    "redis>=5,<6",
    "jsonschema>=4.21,<5",
    "referencing>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23,<2",
    "fakeredis>=2.21,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
