# app.dev.vexa.ai — the minutes terminal, fronted so it can be REPLACED without being stopped.
#
# The only difference from the vhost this replaces is the `proxy_pass` target: an upstream NAME
# instead of a hard-coded `127.0.0.1:15401`. That one change is what makes decision 39 possible.
# A container that owns :15401 cannot be swapped while it is up — the replacement cannot bind the
# port until the old one lets go, and letting go IS the downtime the ritual existed to cover. With
# the port owned by nginx, the new terminal comes up on an ephemeral port of its own, is proven
# there, and `deploy.sh` moves the name over with a reload that drops nothing.
#
# ADOPTION — one time, and it changes nothing about what is served:
#   sudo install -m644 vexa-dogfood-upstreams.conf.example /etc/nginx/conf.d/vexa-dogfood-upstreams.conf
#   # edit that file so each upstream names the port its service is on RIGHT NOW (docker ps)
#   sudo cp app.dev.vexa.ai.conf /etc/nginx/sites-available/app.dev.vexa.ai
#   # replace the app.dev.vexa.ai server block currently living in rig.dev.vexa.ai.conf with it
#   sudo nginx -t && sudo systemctl reload nginx
# Verify `curl -sI https://app.dev.vexa.ai/` before and after: same answer, from the same container.
#
# The mail double and the rig keep their own vhosts; only the terminal is blue/green today.

server {
    listen 443 ssl http2;
    server_name app.dev.vexa.ai;

    ssl_certificate     /etc/letsencrypt/live/dev.vexa.ai-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.vexa.ai-0001/privkey.pem;

    location / {
        proxy_pass http://vexa_app;          # rewritten by deploy.sh, in conf.d/vexa-dogfood-upstreams.conf
        include    /etc/nginx/proxy_vexa.conf;
        gzip off;                            # the chat streams; nginx gzip buffering stalls SSE
        proxy_request_buffering off;
    }
}

server {
    listen 80;
    server_name app.dev.vexa.ai;
    return 301 https://$host$request_uri;
}
