# The two SERVER host ports, fronted — the second half of blue/green adoption, and the half that is
# easy to skip and expensive to skip.
#
# Switching the compose network ALIAS moves everything that resolves `agent-api` inside the network:
# the terminal's server-side proxy, the mcp service, the gateway. It does NOT move anything that
# reaches agent-api over a HOST port — and the flows lane does exactly that, at
# http://localhost:18500. A swap that moved only the alias would leave the lane talking to the
# previous container while every in-network consumer talked to the new one, with nothing reporting
# it: both are healthy, both answer, and they are different builds. That is a worse failure than
# the outage decision 39 removed, because it is invisible.
#
# So the stable server ports are nginx's too, exactly like app.dev.vexa.ai.
#
# ADOPTION is the one step in the whole scheme that costs a restart, because the ports have to be
# taken away from the containers that publish them:
#   1. remove the `ports:` mapping for agent-api and runtime from the dogfood compose override
#      (the containers keep serving 8100/8090 inside the network),
#   2. `docker compose -p vexa-dogfood up -d --no-deps agent-api runtime` — ONE recreation, during
#      a window, announced. This is the last "out / in" there will be.
#   3. install this file and reload nginx; the upstreams file now decides what :18500 and :18490 mean.
# After that no swap ever needs a window again.

server {
    listen 127.0.0.1:18500;
    location / { proxy_pass http://vexa_agent_api; include /etc/nginx/proxy_vexa.conf; proxy_buffering off; }
}

server {
    listen 127.0.0.1:18490;
    location / { proxy_pass http://vexa_runtime; include /etc/nginx/proxy_vexa.conf; proxy_buffering off; }
}
