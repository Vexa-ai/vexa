{{- if .Values.agentApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vexa.componentName" (list . "agent-api") }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.agentApi.replicaCount }}
  {{- if eq (.Values.agentApi.workspaces.accessMode | default "ReadWriteOnce") "ReadWriteMany" }}
  {{- include "vexa.deploymentStrategy" . | nindent 2 }}
  {{- else }}
  # agent-api mounts the single agent-workspaces PVC. A ReadWriteOnce volume cannot be held by two
  # pods at once, so the shared zero-downtime RollingUpdate (maxSurge:1) would deadlock on a
  # Multi-Attach error — the new pod can't mount until the old one releases, and maxUnavailable:0
  # forbids the old one from leaving first. Recreate tears the old pod down before the new one
  # starts. A ReadWriteMany workspace (multi-worker dispatch) lifts the constraint and takes the
  # shared rolling strategy instead.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "vexa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent-api
  template:
    metadata:
      labels:
        {{- include "vexa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent-api
      annotations:
        {{- toYaml .Values.global.podAnnotations | nindent 8 }}
    spec:
      {{- include "vexa.podSecurityContext" . | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent-api
          {{- include "vexa.containerSecurityContext" . | nindent 10 }}
          image: "{{ .Values.agentApi.image.repository }}:{{ .Values.global.imageTag | default .Values.agentApi.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8100
          env:
            - name: VEXA_AGENT_API_PORT
              value: "8100"
            - name: VEXA_RUNTIME_API_URL
              value: "http://{{ include "vexa.componentName" (list . "runtime") }}:{{ .Values.runtime.service.port }}"
            - name: VEXA_AGENT_API_SELF_URL
              value: "http://{{ include "vexa.componentName" (list . "agent-api") }}:{{ .Values.agentApi.service.port }}"
            - name: VEXA_GATEWAY_URL
              value: "http://{{ include "vexa.componentName" (list . "gateway") }}:{{ .Values.gateway.service.port }}"
            # Owner-scopes the live SSE feed (GET /api/meeting/stream): agent-api hits GET /meetings/{id}
            # on meeting-api to verify the caller owns the row before opening the redis transcript stream
            # (P0 cross-tenant guard, fail-closed). The compose-only default http://meeting-api:8080 does
            # not resolve in-cluster, so set the release-qualified Service DNS (#677, sibling of #634).
            - name: VEXA_MEETING_API_URL
              value: "http://{{ include "vexa.componentName" (list . "meeting-api") }}:{{ .Values.meetingApi.service.port }}"
            - name: VEXA_AGENT_PROFILE
              value: "agent"
            # Equal to the runtime's VEXA_WORKSPACE_MOUNT_TARGET and to the store's mountPath below.
            - name: VEXA_WORKSPACES_DIR
              value: {{ include "vexa.workspacesDir" . | quote }}
            # Three-tier mount stack (AMENDMENT 4): the platform-owned GLOBAL SYSTEM workspace (_global),
            # mounted into every worker. Empty = agent-api's in-store /workspaces/_global, created empty at
            # boot (an empty _global is fine); set a path only for a separately provisioned repo. REF pins
            # it for safe rollout (empty = HEAD).
            - name: VEXA_GLOBAL_SYSTEM_WORKSPACE_PATH
              value: {{ .Values.agentApi.globalSystemWorkspacePath | default "" | quote }}
            - name: VEXA_GLOBAL_SYSTEM_WORKSPACE_REF
              value: {{ .Values.agentApi.globalSystemWorkspaceRef | default "" | quote }}
            - name: VEXA_GLOBAL_ADMIN_SUBJECTS
              value: {{ .Values.agentApi.globalAdminSubjects | default "" | quote }}
            {{- include "vexa.redisPasswordEnv" . | nindent 12 }}
            - name: VEXA_REDIS_URL
              value: {{ include "vexa.redisUrl" . | quote }}
            # The internal tier agent-api both presents (Lane M) and BELIEVES (_internal_caller,
            # meeting-room gate 0). The chart never set it here at all, so every helm deploy ran
            # agent-api with an empty secret; it is required-explicit now and the boot refuses
            # without it (F95).
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: INTERNAL_API_SECRET
            # The runtime caller credential agent-api presents on every runtime.v1 / schedule.v1 call.
            - name: RUNTIME_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: RUNTIME_API_TOKEN
            # gateway-identity.v1: the gateway's PUBLIC key (the identity-public-key ConfigMap, mounted
            # below). This service verifies the gateway's signature and cannot make one.
            - name: VEXA_GATEWAY_IDENTITY_PUBLIC_KEY_FILE
              value: /run/vexa-identity/public/key.pem
            # THE WORKER'S TOOLBELT (worker_toolbelt): each worker presents a per-dispatch delegation
            # token, signed with this secret, at the gateway's /mcp — the one assembled MCP server.
            {{- if .Values.mcp.enabled }}
            - name: VEXA_MCP_URL
              value: "http://{{ include "vexa.componentName" (list . "gateway") }}:{{ .Values.gateway.service.port }}/mcp"
            {{- end }}
            - name: VEXA_MCP_DELEGATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: VEXA_MCP_DELEGATION_SECRET
            - name: VEXA_DISPATCH_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: VEXA_DISPATCH_SIGNING_KEY
            - name: VEXA_BOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: VEXA_BOT_API_KEY
                  optional: true
            # The credential store's key, and the profile that decides whether it may be absent
            # (R-E08). See values.yaml `secrets.secretsKey`.
            - name: VEXA_SECRETS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: VEXA_SECRETS_KEY
                  optional: true
            - name: VEXA_ENV
              value: {{ .Values.vexaEnv | default "development" | quote }}
            - name: VEXA_AGENT_MODEL
              value: {{ .Values.models.agentModel | default "" | quote }}
            - name: VEXA_AGENT_AUTO_CONTINUE_CHAT
              value: {{ .Values.agentApi.autoContinueChat | toString | quote }}
            - name: VEXA_AGENT_MAX_CHAT_CONTINUATIONS
              value: {{ .Values.agentApi.maxChatContinuations | toString | quote }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: ANTHROPIC_AUTH_TOKEN
                  optional: true
            - name: ANTHROPIC_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: ANTHROPIC_BASE_URL
                  optional: true
            # claude CLI subscription OAuth — agent-api stamps this (with the ANTHROPIC_* trio
            # above) into every worker dispatch spec env, the only credential path for workers
            # spawned as Pods (dispatch.py MODEL_AUTH_ENV_ALLOWLIST). optional: a creds-less
            # deploy boots fine and fails at inference with the actionable auth error.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: CLAUDE_CODE_OAUTH_TOKEN
                  optional: true
            - name: ANTHROPIC_MODEL
              value: {{ .Values.models.anthropicModel | default "" | quote }}
            - name: ANTHROPIC_DEFAULT_OPUS_MODEL
              value: {{ .Values.models.anthropicOpusModel | default "" | quote }}
            - name: ANTHROPIC_DEFAULT_SONNET_MODEL
              value: {{ .Values.models.anthropicSonnetModel | default "" | quote }}
            - name: ANTHROPIC_DEFAULT_HAIKU_MODEL
              value: {{ .Values.models.anthropicHaikuModel | default "" | quote }}
            - name: VEXA_LOG_LEVEL
              value: {{ .Values.agentApi.logLevel | default "info" | quote }}
            {{- if include "vexa.credentialBrokerEnabled" . }}
            # Connections (credential-broker.v1): agent-api signs as the `agent` role, never `human`.
            - name: VEXA_CONNECTIONS_BROKER_URL
              value: {{ include "vexa.credentialBrokerUrl" . | quote }}
            - name: VEXA_CONNECTIONS_AGENT_KEY_FILE
              value: /run/vexa-connections/agent/key
            {{- if .Values.credentialBroker.gitStore }}
            - name: VEXA_GIT_STORE_BROKER_URL
              value: {{ include "vexa.credentialBrokerUrl" . | quote }}
            - name: VEXA_GIT_STORE_KEY_FILE
              value: /run/vexa-connections/git/key
            {{- end }}
            {{- end }}
            {{- with .Values.agentApi.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: workspaces
              mountPath: {{ include "vexa.workspacesDir" . }}
            - name: identity-public-key
              mountPath: /run/vexa-identity/public
              readOnly: true
            {{- if include "vexa.credentialBrokerEnabled" . }}
            - name: connections-keys
              mountPath: /run/vexa-connections
              readOnly: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 40
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.agentApi.resources | nindent 12 }}
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: {{ include "vexa.componentName" (list . "agent-workspaces") }}
        # gateway-identity.v1: the public key only — the signing key is mounted by the gateway alone.
        - name: identity-public-key
          configMap:
            name: {{ include "vexa.componentName" (list . "identity-public-key") }}
            defaultMode: 0444
            items:
              - { key: public-key.pem, path: key.pem }
        {{- if include "vexa.credentialBrokerEnabled" . }}
        # The agent role key (and the git role key when gitStore is on) — never the human key.
        - name: connections-keys
          secret:
            secretName: {{ include "vexa.credentialBrokerKeys" . }}
            defaultMode: 0444
            items:
              - { key: agent.key, path: agent/key }
              {{- if .Values.credentialBroker.gitStore }}
              - { key: git.key, path: git/key }
              {{- end }}
        {{- end }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "vexa.topologySpreadConstraints" (list . .Values.agentApi "agent-api")) }}
      {{- . | nindent 6 }}
      {{- end }}
{{- end }}
