{{- if include "vexa.credentialBrokerEnabled" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vexa.componentName" (list . "credential-broker") }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
    app.kubernetes.io/component: credential-broker
spec:
  type: {{ .Values.credentialBroker.service.type }}
  ports:
    - name: http
      port: {{ .Values.credentialBroker.service.port }}
      targetPort: http
  selector:
    {{- include "vexa.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: credential-broker
{{- end }}
