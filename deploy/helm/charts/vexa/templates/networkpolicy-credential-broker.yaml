{{- if and (include "vexa.credentialBrokerEnabled" .) .Values.credentialBroker.networkPolicy.enabled }}
# Only agent-api (roles agent and git), the terminal (role human) and, with bot accounts on,
# meeting-api (role bots), with transcript signals on, signals (role signals) and, with
# flows.mail.smtp.passwordRef, the flows Pods (role sensors) may open a connection to the broker. Worker Pods the runtime spawns hold no
# key and cannot reach it at all.
# Egress stays open: the broker calls Google and the HTTPS services a person approved.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vexa.componentName" (list . "credential-broker") }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
    app.kubernetes.io/component: credential-broker
spec:
  podSelector:
    matchLabels:
      {{- include "vexa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: credential-broker
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "vexa.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: agent-api
        - podSelector:
            matchLabels:
              {{- include "vexa.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: terminal
        {{- if include "vexa.botAccountsEnabled" . }}
        - podSelector:
            matchLabels:
              {{- include "vexa.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: meeting-api
        {{- end }}
        {{- if .Values.signals.enabled }}
        - podSelector:
            matchLabels:
              {{- include "vexa.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: signals
        {{- end }}
        {{- if and .Values.flows.enabled ((.Values.flows.mail | default dict).smtp | default dict).passwordRef }}
        {{- /* role sensors: flows reads the mail relay's password by reference */}}
        - podSelector:
            matchLabels:
              {{- include "vexa.selectorLabels" . | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [flows-api, flows-worker, flows-mailbox]
        {{- end }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
