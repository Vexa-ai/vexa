{{- define "vexa.crmEnv" -}}
{{- $secret := .Values.crm.existingSecret | default (include "vexa.componentName" (list . "crm-db")) -}}
- name: CRM_DB_PASSWORD
  valueFrom: {secretKeyRef: {name: {{ $secret | quote }}, key: password}}
- name: DB_NAME
  valueFrom: {secretKeyRef: {name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}, key: POSTGRES_DB}}
- name: CRM_DATABASE_URL
  value: "postgresql+pg8000://{{ .Values.crm.dbUser }}:$(CRM_DB_PASSWORD)@{{ include "vexa.dbHostEffective" . }}:{{ include "vexa.dbPortEffective" . }}/$(DB_NAME)"
- name: CRM_ORG_ID
  value: {{ .Values.crm.orgId | quote }}
- name: ADMIN_API_URL
  value: "http://{{ include "vexa.componentName" (list . "admin-api") }}:{{ .Values.adminApi.service.port }}"
- name: INTERNAL_API_SECRET
  valueFrom: {secretKeyRef: {name: {{ include "vexa.adminTokenSecretName" . | quote }}, key: INTERNAL_API_SECRET}}
{{- end -}}
{{- if .Values.crm.enabled }}
{{- if not .Values.crm.orgId }}
{{- fail "crm.enabled needs crm.orgId: one organisation per install (ADR-0047)" }}
{{- end }}
{{- $name := include "vexa.componentName" (list . "crm-api") }}
{{- $secret := .Values.crm.existingSecret | default (include "vexa.componentName" (list . "crm-db")) }}
{{- $image := printf "%s:%s" .Values.crm.image.repository (.Values.global.imageTag | default .Values.crm.image.tag) }}
{{- if not .Values.crm.existingSecret }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secret).data | default dict }}
# The optional CRM (ADR-0047). Its own Postgres role's password: generated once, then reused (lookup
# returns the live Secret on every render); a `helm template` pipeline cannot look anything up — set
# crm.existingSecret there. A hook ahead of the schema Job, which sets it on the role.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
    app.kubernetes.io/component: crm-api
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  {{- if hasKey $existing "password" }}
  password: {{ index $existing "password" }}
  {{- else }}
  password: {{ randAlphaNum 48 | sha256sum | b64enc }}
  {{- end }}
---
{{- end }}
# The CRM's migrations path: with the database's admin credential, creates (or re-asserts) the CRM's
# own login role — no superuser, grants on the crm_* tables only — the tables, and the organisation
# with its entity types, then exits. crm-api waits for it (initContainer) and never holds the admin
# credential. Compose runs the same command as `crm-init`.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vexa.componentName" (list . "crm-schema") }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "vexa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      {{- include "vexa.nonRootPodSecurityContext" . | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: crm-schema
          {{- include "vexa.containerSecurityContext" . | nindent 10 }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["python", "-m", "crm.migrate", "init"]
          env:
            - name: DB_HOST
              value: {{ include "vexa.dbHostEffective" . | quote }}
            - name: DB_PORT
              value: {{ include "vexa.dbPortEffective" . | quote }}
            - name: DB_NAME
              valueFrom: {secretKeyRef: {name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}, key: POSTGRES_DB}}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}, key: POSTGRES_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}, key: POSTGRES_PASSWORD}}
            - name: CRM_DB_USER
              value: {{ .Values.crm.dbUser | quote }}
            - name: CRM_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $secret | quote }}, key: password}}
            - name: CRM_ORG_ID
              value: {{ .Values.crm.orgId | quote }}
            - name: CRM_ORG_NAME
              value: {{ .Values.crm.orgName | default .Values.crm.orgId | quote }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.crm.replicaCount }}
  {{- include "vexa.deploymentStrategy" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "vexa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: crm-api
  template:
    metadata:
      labels:
        {{- include "vexa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: crm-api
      annotations:
        {{- toYaml .Values.global.podAnnotations | nindent 8 }}
    spec:
      {{- include "vexa.nonRootPodSecurityContext" . | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # waits, as the CRM's own role, until the schema Job has made the role and the tables
        - name: crm-schema-ready
          {{- include "vexa.containerSecurityContext" . | nindent 10 }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["python", "-m", "crm.migrate", "check"]
          env:
            {{- include "vexa.crmEnv" . | nindent 12 }}
      containers:
        - name: crm-api
          {{- include "vexa.containerSecurityContext" . | nindent 10 }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8300
          env:
            {{- include "vexa.crmEnv" . | nindent 12 }}
            - name: VEXA_FEATURES
              value: {{ .Values.features | default "" | quote }}
            {{- if .Values.agentApi.enabled }}
            # where the desk's limits are read (_global/POLICIES.md); unset = the defaults
            - name: CRM_AGENT_API_URL
              value: "http://{{ include "vexa.componentName" (list . "agent-api") }}:{{ .Values.agentApi.service.port }}"
            {{- end }}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.crm.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8300
      targetPort: http
  selector:
    {{- include "vexa.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: crm-api
{{- end }}
