{{- if include "vexa.credentialBrokerEnabled" . }}
# Connections — the credential broker (credential-broker.v1, ADR-0040). One replica: its state is
# SQLite on a ReadWriteOnce volume, so the rollout is Recreate. Reachable only from agent-api and
# the terminal (networkpolicy-credential-broker.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vexa.componentName" (list . "credential-broker") }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
    app.kubernetes.io/component: credential-broker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "vexa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: credential-broker
  template:
    metadata:
      labels:
        {{- include "vexa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: credential-broker
      annotations:
        {{- toYaml .Values.global.podAnnotations | nindent 8 }}
    spec:
      {{- if eq (include "vexa.securityContextDeliver" .) "true" }}
      # The image runs as uid 10001; fsGroup makes the state volume writable by it.
      securityContext:
        {{- toYaml (merge (deepCopy (.Values.global.podSecurityContext | default dict)) (dict "runAsNonRoot" true "runAsUser" 10001 "runAsGroup" 10001 "fsGroup" 10001)) | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      containers:
        - name: credential-broker
          {{- if eq (include "vexa.securityContextDeliver" .) "true" }}
          securityContext:
            {{- toYaml (merge (dict "readOnlyRootFilesystem" true) (omit (.Values.global.securityContext | default dict) "deliver")) | nindent 12 }}
          {{- end }}
          image: "{{ .Values.credentialBroker.image.repository }}:{{ .Values.global.imageTag | default .Values.credentialBroker.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8100
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: VEXA_CONNECTIONS_AGENT_KEY_FILE
              value: /run/vexa-connections/agent/key
            - name: VEXA_CONNECTIONS_HUMAN_KEY_FILE
              value: /run/vexa-connections/human/key
            - name: VEXA_CONNECTIONS_GIT_KEY_FILE
              value: /run/vexa-connections/git/key
            - name: VEXA_CONNECTIONS_STATE_DIR
              value: /state
            - name: VEXA_CONNECTIONS_STORE
              value: {{ .Values.credentialBroker.store.backend | default "local" | quote }}
            - name: VEXA_CONNECTIONS_STORE_KEY_FILE
              value: /run/vexa-connections/store/key
            {{- if eq (.Values.credentialBroker.store.backend | default "local") "openbao" }}
            - name: VEXA_CONNECTIONS_OPENBAO_ADDR
              value: {{ required "credentialBroker.openbao.address is required with store.backend=openbao" .Values.credentialBroker.openbao.address | quote }}
            - name: VEXA_CONNECTIONS_OPENBAO_TOKEN_FILE
              value: /run/vexa-openbao/token
            - name: VEXA_CONNECTIONS_OPENBAO_MOUNT
              value: {{ .Values.credentialBroker.openbao.mount | default "connections" | quote }}
            {{- end }}
            {{- if .Values.credentialBroker.google.clientId }}
            - name: VEXA_CONNECTIONS_GOOGLE_CLIENT_ID
              value: {{ .Values.credentialBroker.google.clientId | quote }}
            - name: VEXA_CONNECTIONS_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.credentialBrokerKeys" . }}
                  key: google-client-secret
                  optional: true
            {{- end }}
            {{- with include "vexa.credentialBrokerRedirect" . }}
            - name: VEXA_CONNECTIONS_PRODUCT_REDIRECT
              value: {{ . | quote }}
            {{- end }}
            # gateway-identity.v1: every agent-role call carries the gateway's signature over the
            # person, forwarded by agent-api; the broker verifies it with this public key.
            - name: VEXA_GATEWAY_IDENTITY_PUBLIC_KEY_FILE
              value: /run/vexa-identity/public/key.pem
          volumeMounts:
            - name: state
              mountPath: /state
            - name: keys
              mountPath: /run/vexa-connections
              readOnly: true
            - name: identity-public-key
              mountPath: /run/vexa-identity/public
              readOnly: true
            {{- if eq (.Values.credentialBroker.store.backend | default "local") "openbao" }}
            - name: openbao-token
              mountPath: /run/vexa-openbao
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.credentialBroker.resources | nindent 12 }}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "vexa.componentName" (list . "credential-broker-state") }}
        - name: keys
          secret:
            secretName: {{ include "vexa.credentialBrokerKeys" . }}
            defaultMode: 0440
            items:
              - { key: agent.key, path: agent/key }
              - { key: human.key, path: human/key }
              - { key: git.key, path: git/key }
              - { key: store.key, path: store/key }
        {{- if eq (.Values.credentialBroker.store.backend | default "local") "openbao" }}
        - name: openbao-token
          secret:
            secretName: {{ required "credentialBroker.openbao.tokenSecret is required with store.backend=openbao" .Values.credentialBroker.openbao.tokenSecret }}
            defaultMode: 0440
            items:
              - { key: token, path: token }
        {{- end }}
        # gateway-identity.v1: the public key only — the signing key is mounted by the gateway alone.
        - name: identity-public-key
          configMap:
            name: {{ include "vexa.componentName" (list . "identity-public-key") }}
            defaultMode: 0444
            items:
              - { key: public-key.pem, path: key.pem }
        - name: tmp
          emptyDir: {}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
