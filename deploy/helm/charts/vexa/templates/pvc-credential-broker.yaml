{{- if include "vexa.credentialBrokerEnabled" . }}
# The broker's state: connection metadata and audit, the PKCE derivation key, and — with the local
# backend — the encrypted credential store. Ciphertext only: the store key lives in the keys Secret.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vexa.componentName" (list . "credential-broker-state") }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
    app.kubernetes.io/component: credential-broker
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.credentialBroker.store.size | default "1Gi" }}
  {{- if .Values.credentialBroker.store.storageClassName }}
  storageClassName: {{ .Values.credentialBroker.store.storageClassName | quote }}
  {{- end }}
{{- end }}
