{{- if .Values.terminal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vexa.componentName" (list . "terminal") }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.terminal.replicaCount }}
  {{- include "vexa.deploymentStrategy" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "vexa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: terminal
  template:
    metadata:
      labels:
        {{- include "vexa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: terminal
      annotations:
        {{- toYaml .Values.global.podAnnotations | nindent 8 }}
    spec:
      {{- include "vexa.nonRootPodSecurityContext" . | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: terminal
          {{- include "vexa.containerSecurityContext" . | nindent 10 }}
          image: "{{ .Values.terminal.image.repository }}:{{ .Values.global.imageTag | default .Values.terminal.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            # Gateway base URL — HTTP scheme: the REST proxy ([...path]/route.ts) fetches it as http,
            # and server.mjs converts it to ws:// itself for the /ws upgrade. Setting ws:// here breaks
            # the REST proxy (fetch can't speak ws → 502).
            - name: GATEWAY_URL
              value: "http://{{ include "vexa.componentName" (list . "gateway") }}:{{ .Values.gateway.service.port }}"
            - name: AGENT_API_URL
              value: "http://{{ include "vexa.componentName" (list . "agent-api") }}:{{ .Values.agentApi.service.port }}"
            - name: VEXA_ADMIN_API_URL
              value: "http://{{ include "vexa.componentName" (list . "admin-api") }}:{{ .Values.adminApi.service.port }}"
            - name: VEXA_API_URL
              value: "http://{{ include "vexa.componentName" (list . "gateway") }}:{{ .Values.gateway.service.port }}"
            # Terminal-owned email login finds-or-creates a user + mints a token via admin-api.
            - name: VEXA_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: ADMIN_API_TOKEN
            - name: VEXA_BOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: VEXA_BOT_API_KEY
                  optional: true
            # next-auth session signing secret.
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: NEXTAUTH_SECRET
            # Admin internal edge: internalRequest()/validateAuthToken() need this to claim the
            # admin role + mint per-session keys on sign-in; without it the edge returns 503 and
            # bootstrap-admin fails closed. Same secret+key every other service reads.
            - name: VEXA_INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: INTERNAL_API_SECRET
            {{- if .Values.terminal.publicUrl }}
            # External origin (set when ingress/LB fronts the terminal) — cookie security + OAuth callbacks.
            - name: NEXTAUTH_URL
              value: {{ .Values.terminal.publicUrl | quote }}
            - name: TERMINAL_URL
              value: {{ .Values.terminal.publicUrl | quote }}
            {{- end }}
            {{- if include "vexa.credentialBrokerEnabled" . }}
            # Connections panel (credential-broker.v1): the terminal's server routes sign as the
            # `human` role for the signed-in person. Browser POSTs must come from the public origin.
            - name: VEXA_CONNECTIONS_BROKER_URL
              value: {{ include "vexa.credentialBrokerUrl" . | quote }}
            - name: VEXA_CONNECTIONS_HUMAN_KEY_FILE
              value: /run/vexa-connections/human/key
            - name: VEXA_CONNECTIONS_PUBLIC_ORIGIN
              value: {{ .Values.terminal.publicUrl | default "" | trimSuffix "/" | quote }}
            {{- end }}
            # The sign-in link's mail relay — the deployment's VEXA_MAIL_SMTP_* family
            # (clients/terminal/config.v1.json). The password comes from the chart's Secret.
            - name: VEXA_MAIL_SMTP_HOST
              value: {{ .Values.terminal.mail.smtpHost | default "" | toString | quote }}
            - name: VEXA_MAIL_SMTP_PORT
              value: {{ .Values.terminal.mail.smtpPort | default "" | toString | quote }}
            - name: VEXA_MAIL_SMTP_FROM
              value: {{ .Values.terminal.mail.from | default "" | quote }}
            - name: VEXA_MAIL_SMTP_USER
              value: {{ .Values.terminal.mail.user | default "" | quote }}
            - name: VEXA_MAIL_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: VEXA_MAIL_SMTP_PASSWORD
                  optional: true
            - name: VEXA_MAIL_SMTP_SECURE
              value: {{ .Values.terminal.mail.secure | default "" | toString | quote }}
            - name: VEXA_MAIL_SMTP_TLS_INSECURE
              value: {{ .Values.terminal.mail.tlsInsecure | default "" | toString | quote }}
            {{- with .Values.terminal.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if include "vexa.credentialBrokerEnabled" . }}
          volumeMounts:
            - name: connections-keys
              mountPath: /run/vexa-connections
              readOnly: true
          {{- end }}
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 40
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.terminal.resources | nindent 12 }}
      {{- if include "vexa.credentialBrokerEnabled" . }}
      volumes:
        # The human role key only.
        - name: connections-keys
          secret:
            secretName: {{ include "vexa.credentialBrokerKeys" . }}
            defaultMode: 0444
            items:
              - { key: human.key, path: human/key }
      {{- end }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "vexa.topologySpreadConstraints" (list . .Values.terminal "terminal")) }}
      {{- . | nindent 6 }}
      {{- end }}
{{- end }}
