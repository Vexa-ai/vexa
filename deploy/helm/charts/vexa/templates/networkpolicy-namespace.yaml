{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.defaultDeny.enabled }}
{{- /*
THE NAMESPACE DEFAULT: NOTHING IN, NOTHING OUT, EXCEPT WHAT A POLICY ALLOWS.

`default-deny` selects every Pod in the release's namespace, so a Pod no policy below names — another
application's, or one added by hand — takes no connection and makes none. Install Vexa in a namespace
of its own, or give those Pods their own policies.

What the chart's Pods are allowed (the per-service policies in networkpolicy.yaml,
networkpolicy-workloads.yaml and networkpolicy-credential-broker.yaml add to these):

  INGRESS
    gateway, terminal, dashboard     from anywhere, on their own port — they are the front doors
    admin-api, mcp, pgbouncer        from the chart's Pods
    flows-api                        from the chart's Pods and agent workers (the timeline)
    agent-api, meeting-api, runtime  their own policies (named callers only)
    credential-broker                its own policy (agent-api and the terminal)
    model-proxy                      its own policy (agent workers only)
    postgres                         from the services that hold its credentials: admin-api,
                                     meeting-api, agent-api (the session store, ADR-0048),
                                     pgbouncer, the flows tier, the migrations Job, and with the CRM
                                     on crm-api and its outbox
    redis                            from the chart's Pods and the Pods the runtime spawns
    everything above                 + networkPolicy.controlPlane.extraIngress (a monitoring scraper)

  EGRESS
    postgres, redis                  nothing
    every other chart Pod            DNS; the chart's Pods; and any address outside
                                     networkPolicy.controlPlane.egressExcept (the cloud metadata
                                     range by default) — databases, object stores, model providers,
                                     STT, mail and webhook targets live wherever the operator keeps
                                     them, and the Kubernetes API (runtime, the postgres-password
                                     hook) sits on a private address
    the Pods the runtime spawns      their own policies (networkpolicy-workloads.yaml)

All of this is inert without a CNI that enforces NetworkPolicy.
*/}}
{{- $sel := include "vexa.selectorLabels" . | fromYaml }}
{{- $cp := .Values.networkPolicy.controlPlane }}
{{- $flows := list "flows-worker" "flows-api" "flows-mailbox" }}
{{- $chartPods := list (dict "podSelector" (dict "matchLabels" $sel)) (dict "podSelector" (dict "matchLabels" $sel "matchExpressions" (list (dict "key" "app.kubernetes.io/component" "operator" "In" "values" $flows)))) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vexa.componentName" (list . "default-deny") }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
{{- /* egress of every chart Pod but the two datastores, and but the flows Pods while their own
policy holds them (networkpolicy-flows.yaml): policies add up, so a Pod this one also selected
would keep every egress it allows */}}
{{- /* "any address": everything outside egressExcept, the one shape the chart uses for an endpoint
whose address it cannot know */}}
{{- $anyList := list (dict "ipBlock" (ternary (dict "cidr" "0.0.0.0/0") (dict "cidr" "0.0.0.0/0" "except" $cp.egressExcept.ipv4) (empty $cp.egressExcept.ipv4))) }}
{{- if $.Values.networkPolicy.workloads.ipv6 }}
{{- $anyList = append $anyList (dict "ipBlock" (ternary (dict "cidr" "::/0") (dict "cidr" "::/0" "except" $cp.egressExcept.ipv6) (empty $cp.egressExcept.ipv6))) }}
{{- end }}
{{- $anyPeers := toYaml $anyList }}
{{- /* the external endpoints the values configure, each on its own port: the database and Redis when
the chart runs neither, and the object store */}}
{{- $external := list }}
{{- if not .Values.postgres.enabled }}
{{- $external = append $external (dict "port" .Values.database.port "cidrs" $cp.databaseEgress) }}
{{- end }}
{{- if not .Values.redis.enabled }}
{{- $external = append $external (dict "port" .Values.redisConfig.port "cidrs" $cp.redisEgress) }}
{{- end }}
{{- with .Values.storage.s3.endpoint }}
{{- $u := urlParse . }}
{{- $port := regexFind ":[0-9]+$" $u.host | trimPrefix ":" }}
{{- $external = append $external (dict "port" ($port | default (ternary 80 443 (eq $u.scheme "http"))) "cidrs" $cp.storageEgress) }}
{{- end }}
{{- $notIn := list "postgres" "redis" }}
{{- if and .Values.flows.enabled (.Values.networkPolicy.flows | default dict).enabled }}
{{- $notIn = concat $notIn $flows }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vexa.componentName" (list $ "control-plane-egress") }}
  labels:
    {{- include "vexa.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $sel | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values:
          {{- toYaml $notIn | nindent 10 }}
  policyTypes: [Egress]
  egress:
    {{- include "vexa.dnsEgress" $ | nindent 4 }}
    - to:
        {{- toYaml $chartPods | nindent 8 }}
    {{- if $cp.anyAddress }}
    - to:
        {{- $anyPeers | nindent 8 }}
    {{- else }}
    {{- range $cp.egress }}
    {{- if not (and .cidr .ports) }}
    {{- fail "networkPolicy.controlPlane.egress: every entry needs a cidr and its ports, e.g. {cidr: 203.0.113.10/32, ports: [443]}" }}
    {{- end }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        {{- range .ports }}
        - port: {{ . | int }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- range $ext := $external }}
    - to:
        {{- with $ext.cidrs }}
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- else }}
        {{- $anyPeers | nindent 8 }}
        {{- end }}
      ports:
        - port: {{ $ext.port | int }}
          protocol: TCP
    {{- end }}
    {{- end }}
    {{- with $cp.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
{{- if not $cp.anyAddress }}
{{- /* the Kubernetes API server: the runtime's k8s backend and the postgres-password hook call it.
Policies match the API server's own address and port (443 on managed clusters, 6443 on kubeadm and
kind), which the chart cannot know: any address on those ports unless apiServer.cidrs names it */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vexa.componentName" (list $ "api-server-egress") }}
  labels:
    {{- include "vexa.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $sel | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [runtime, postgres-password]
  policyTypes: [Egress]
  egress:
    - to:
        {{- with $cp.apiServer.cidrs }}
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- else }}
        {{- $anyPeers | nindent 8 }}
        {{- end }}
      ports:
        {{- range $cp.apiServer.ports }}
        - port: {{ . | int }}
          protocol: TCP
        {{- end }}
---
{{- end }}
{{- /* the front doors */}}
{{- range $door := list (dict "c" "gateway" "on" $.Values.gateway.enabled "port" 8000) (dict "c" "terminal" "on" $.Values.terminal.enabled "port" 3000) (dict "c" "dashboard" "on" $.Values.dashboard.enabled "port" 3000) }}
{{- if $door.on }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vexa.componentName" (list $ (printf "%s-ingress" $door.c)) }}
  labels:
    {{- include "vexa.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $sel | nindent 6 }}
      app.kubernetes.io/component: {{ $door.c }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: {{ $door.port }}
          protocol: TCP
---
{{- end }}
{{- end }}
{{- /* THE GATEWAY'S SERVICE DOOR (8002): the flows tier, and the internal-tier callers of flows-api
(the signals service, the terminal) — nobody else. The front-door policy above opens 8000 only. */}}
{{- if and $.Values.gateway.enabled $.Values.flows.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vexa.componentName" (list $ "gateway-door-ingress") }}
  labels:
    {{- include "vexa.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $sel | nindent 6 }}
      app.kubernetes.io/component: gateway
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8002
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- toYaml $sel | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [flows-worker, flows-api, flows-mailbox, signals, terminal]
---
{{- end }}
{{- /* internal services the chart's own Pods call. admin-api and crm-api admit the components that
call them by name (each one's ADMIN_API_URL / CRM_API_URL in this chart): flows reaches both only
through the gateway's service door, and no other Pod calls them. */}}
{{- $crmOn := and $.Values.crm $.Values.crm.enabled }}
{{- $adminCallers := list "gateway" "terminal" "dashboard" "mcp" "agent-api" "meeting-api" }}
{{- if $crmOn }}{{ $adminCallers = concat $adminCallers (list "crm-api" "crm-outbox") }}{{ end }}
{{- $crmCallers := list "gateway" "mcp" "agent-api" "admin-api" }}
{{- range $svc := list (dict "c" "admin-api" "on" $.Values.adminApi.enabled "port" 8001 "callers" $adminCallers "extra" ($.Values.networkPolicy.adminApi | default dict).extraFrom) (dict "c" "mcp" "on" $.Values.mcp.enabled "port" 8010) (dict "c" "pgbouncer" "on" $.Values.pgbouncer.enabled "port" 5432) (dict "c" "crm-api" "on" $crmOn "port" 8300 "callers" $crmCallers "extra" ($.Values.networkPolicy.crmApi | default dict).extraFrom) }}
{{- if $svc.on }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vexa.componentName" (list $ (printf "%s-ingress" $svc.c)) }}
  labels:
    {{- include "vexa.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $sel | nindent 6 }}
      app.kubernetes.io/component: {{ $svc.c }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: {{ $svc.port }}
          protocol: TCP
      from:
        {{- if $svc.callers }}
        - podSelector:
            matchLabels:
              {{- toYaml $sel | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: {{ $svc.callers | toJson }}
        {{- with $svc.extra }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- else }}
        {{- toYaml $chartPods | nindent 8 }}
        {{- end }}
---
{{- end }}
{{- end }}
{{- if .Values.flows.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vexa.componentName" (list . "flows-api-ingress") }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $sel | nindent 6 }}
      app.kubernetes.io/component: flows-api
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 18200
          protocol: TCP
      from:
        {{- toYaml $chartPods | nindent 8 }}
        - podSelector:
            matchLabels:
              runtime.managed: "true"
              vexa.role: worker
---
{{- end }}
{{- if .Values.postgres.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vexa.componentName" (list . "postgres-ingress") }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $sel | nindent 6 }}
      app.kubernetes.io/component: postgres
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 5432
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- toYaml $sel | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [admin-api, meeting-api, agent-api, pgbouncer, migrations{{ if and .Values.crm .Values.crm.enabled }}, crm-api{{ if .Values.flows.enabled }}, crm-outbox{{ end }}{{ end }}]
        - podSelector:
            matchLabels:
              {{- toYaml $sel | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: {{ $flows | toJson }}
        {{- with .Values.networkPolicy.postgres.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
{{- end }}
{{- if .Values.redis.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vexa.componentName" (list . "redis-ingress") }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $sel | nindent 6 }}
      app.kubernetes.io/component: redis
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 6379
          protocol: TCP
      from:
        {{- toYaml $chartPods | nindent 8 }}
        - podSelector:
            matchLabels:
              runtime.managed: "true"
---
{{- end }}
{{- if and (include "vexa.credentialBrokerEnabled" .) (not .Values.credentialBroker.networkPolicy.enabled) }}
{{- /* the broker's own policy is off: it still answers the chart's Pods */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vexa.componentName" (list . "credential-broker-ingress") }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $sel | nindent 6 }}
      app.kubernetes.io/component: credential-broker
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml $chartPods | nindent 8 }}
---
{{- end }}
{{- with .Values.networkPolicy.controlPlane.extraIngress }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vexa.componentName" (list $ "control-plane-extra-ingress") }}
  labels:
    {{- include "vexa.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $sel | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
