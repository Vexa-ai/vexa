{{- if and (include "vexa.credentialBrokerEnabled" .) (not .Values.credentialBroker.existingSecret) }}
{{- $name := include "vexa.componentName" (list . "credential-broker-keys") }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
# Generated once, then reused: lookup returns the live Secret on every upgrade, and the
# resource-policy keeps it through an uninstall, so a reinstall still decrypts the store. A
# `helm template` pipeline cannot look anything up — set credentialBroker.existingSecret there.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
    app.kubernetes.io/component: credential-broker
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := list "agent.key" "human.key" "git.key" "store.key" }}
  {{- if hasKey $existing $key }}
  {{ $key }}: {{ index $existing $key }}
  {{- else }}
  {{ $key }}: {{ printf "%s\n" (randAlphaNum 64 | sha256sum) | b64enc }}
  {{- end }}
  {{- end }}
  {{- if .Values.credentialBroker.google.clientSecret }}
  google-client-secret: {{ .Values.credentialBroker.google.clientSecret | b64enc }}
  {{- else if hasKey $existing "google-client-secret" }}
  google-client-secret: {{ index $existing "google-client-secret" }}
  {{- end }}
{{- end }}
