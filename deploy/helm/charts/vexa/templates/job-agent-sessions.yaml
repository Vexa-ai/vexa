{{- $ss := include "vexa.agentSessions" . | fromYaml }}
{{- if $ss.active }}
{{- $spec := include "vexa.agentSessionsJobSpec" . }}
# The session store's migrations path (ADR-0048): with the database's admin credential, creates (or
# re-asserts) the store's own login role — no superuser, no createdb/createrole, grants on the
# agent_session* tables only — and the tables, then exits. agent-api logs in as that role (its
# initContainer waits for this Job) and never holds the admin credential.
#
# A release resource, not a Helm hook, named after a hash of its own spec. Helm never creates a
# hook-annotated manifest on an event the annotation does not name, so the earlier `pre-upgrade`-only
# hook never ran on `helm install`: agent-api waited in its initContainer and the MCP crash-looped on
# agent's silent manifest until a second `helm upgrade`. A `post-install` hook would deadlock
# `helm install --wait` and an Argo CD PostSync (both wait for agent-api, which waits for this Job).
# As a release resource it runs on install, beside the Pods that wait for it, under --wait and under
# Argo CD alike; a changed image or environment renders a new name, so an upgrade creates a new Job
# (and the old one is pruned) instead of patching an immutable one. The Job retries until Postgres
# answers.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vexa.componentName" (list . "agent-sessions-schema") }}-{{ $spec | sha256sum | trunc 8 }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sessions-schema
{{ $spec }}
{{- end }}
{{- define "vexa.agentSessionsJobSpec" -}}
{{- $ss := include "vexa.agentSessions" . | fromYaml }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "vexa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      enableServiceLinks: false
      restartPolicy: Never
      {{- include "vexa.nonRootPodSecurityContext" . | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "vexa.extraCA.initContainer" . }}
      initContainers:{{ . | trim | nindent 8 }}
      {{- end }}
      {{- with include "vexa.extraCA.volumes" . }}
      volumes:{{ . | trim | nindent 8 }}
      {{- end }}
      containers:
        - name: agent-sessions
          {{- include "vexa.containerSecurityContext" . | nindent 10 }}
          image: "{{ .Values.agentApi.image.repository }}:{{ .Values.global.imageTag | default .Values.agentApi.image.tag | default (include "vexa.releaseTag" .) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["python", "-m", "control_plane.session_schema", "init"]
          {{- with include "vexa.extraCA.mounts" . }}
          volumeMounts:{{ . | trim | nindent 12 }}
          {{- end }}
          env:
            {{- with include "vexa.extraCA.env" . }}{{ . | trim | nindent 12 }}{{ end }}
            - name: DB_HOST
              value: {{ include "vexa.dbHostEffective" . | quote }}
            - name: DB_PORT
              value: {{ include "vexa.dbPortEffective" . | quote }}
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}
                  key: POSTGRES_PASSWORD
            - name: VEXA_SESSIONS_DB_USER
              value: {{ $ss.dbUser | quote }}
            - name: VEXA_SESSIONS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $ss.dbSecret | quote }}
                  key: password
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
