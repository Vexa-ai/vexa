{{- if .Values.flows.enabled }}
# Vexa Minutes — the flows tier: reaction engine (worker), mail integration
# (mailbox) and the management API. Behavior (prompts + flow definitions) is
# data: baked showcase ships in the image; live iteration happens through the
# flows API (flow versions are rows, hot-loaded by the worker within ~10s).
#
# F-D5 — DB CREDENTIALS/HOST/SSL FOLLOW THE SAME PATH admin-api/meeting-api/job-migrations DO:
# DB_USER/DB_PASSWORD/DB_NAME via secretKeyRef against vexa.postgresCredentialsSecretName (never
# a chart value inlined into a rendered Secret — the chart value is a decorative placeholder in
# the postgres.enabled=false shape, where credentials live ONLY in the operator's pre-existing
# Secret), DB_HOST/DB_PORT via vexa.dbHostEffective/vexa.dbPortEffective, sslmode from
# database.sslMode. Kubernetes has no way to interpolate a secretKeyRef value into the middle of
# another env var's string, and flows_config.py declares VEXA_FLOWS_DB_URL as ONE required DSN
# string (unlike admin-api's discrete DB_HOST/DB_PORT/DB_USER/DB_PASSWORD/DB_NAME vars) — so each
# container composes its own DSN at startup from these parts via a thin shell wrapper, then execs
# the real entrypoint. The flows Secret below no longer carries VEXA_FLOWS_DB_URL/ADMIN_DB_URL as
# literal strings for exactly this reason.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vexa.componentName" (list . "flows") }}
type: Opaque
stringData:
  VEXA_MAIL_ADDR: {{ .Values.flows.mail.address | quote }}
  VEXA_MAIL_APP_PASSWORD: {{ .Values.flows.mail.appPassword | quote }}
  # the inbound intake's authorization + ceilings (R-B12) — see values.yaml for what empty means
  VEXA_FLOWS_MAIL_DOMAINS: {{ .Values.flows.mail.domains | quote }}
  VEXA_FLOWS_MAIL_QUARANTINE_REPLY: {{ .Values.flows.mail.quarantineReply | quote }}
  VEXA_FLOWS_MAIL_RATE_PER_SENDER: {{ .Values.flows.mailRate.perSender | quote }}
  VEXA_FLOWS_MAIL_RATE_GLOBAL: {{ .Values.flows.mailRate.global | quote }}
  VEXA_FLOWS_MAIL_RATE_WINDOW_S: {{ .Values.flows.mailRate.windowSeconds | quote }}
  VEXA_FLOWS_API_KEY: {{ .Values.flows.apiKey | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vexa.componentName" (list . "flows-worker") }}
  labels: {app.kubernetes.io/component: flows-worker}
spec:
  replicas: {{ .Values.flows.workerReplicas }}
  selector:
    matchLabels: {app.kubernetes.io/component: flows-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/component: flows-worker}
    spec:
      {{- /* the ensure-db bootstrap only has work to do when the flows tables live in a database
      OTHER than the application's own — when flows.databaseName == database.name they already
      live in a database that is guaranteed to exist (F-D5 follow-up: compose already runs this
      shape, sharing the app's own "vexa" database — no separate CREATE DATABASE anywhere). */}}
      {{- if ne .Values.flows.databaseName .Values.database.name }}
      initContainers:
        - name: ensure-db
          image: {{ include "vexa.flowsImage" . | quote }}
          command: ["python", "-c"]
          args:
            - |
              # Bootstraps the SEPARATE flows.databaseName database (F-D5 item 3+6): connects to
              # the APPLICATION database (database.name via DB_NAME/POSTGRES_DB — guaranteed to
              # exist, unlike Postgres's own "postgres" maintenance database, which many managed
              # Postgres offerings do not expose to the app's own role) purely as a bootstrap
              # target, then checks/creates flows.databaseName. pg_database is a global catalog —
              # visible from any database in the cluster, so the presence check works regardless
              # of which database this connection lands on.
              #
              # Tolerates a role with no CREATEDB (F-D5 item 6, common on managed Postgres): the
              # create is attempted only when the database is absent, and a privilege failure is
              # not immediately fatal — it re-checks once more (another replica, or an operator,
              # may have created it in the meantime / ahead of time) before refusing loudly.
              import os
              from sqlalchemy import create_engine, text
              name = os.environ["FLOWS_DB_NAME"]
              admin_url = (
                  "postgresql+psycopg://" + os.environ["DB_USER"] + ":" + os.environ["DB_PASSWORD"]
                  + "@" + os.environ["DB_HOST"] + ":" + os.environ["DB_PORT"] + "/" + os.environ["DB_NAME"]
                  + "?sslmode=" + os.environ["DB_SSL_MODE"]
              )
              e = create_engine(admin_url, isolation_level="AUTOCOMMIT")
              with e.connect() as c:
                  exists = c.execute(text("SELECT 1 FROM pg_database WHERE datname=:n"), {"n": name}).first()
                  if not exists:
                      try:
                          c.execute(text('CREATE DATABASE "' + name + '"'))
                          print("created database " + name)
                      except Exception as exc:
                          exists = c.execute(text("SELECT 1 FROM pg_database WHERE datname=:n"), {"n": name}).first()
                          if not exists:
                              raise RuntimeError(
                                  "database " + repr(name) + " does not exist and this role could "
                                  "not create it (" + repr(exc) + ") — pre-create it "
                                  "(CREATE DATABASE ...) or grant CREATEDB"
                              ) from exc
                          print("database " + name + " already exists (created by another process)")
                  else:
                      print("database " + name + " already exists")
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}
                  key: POSTGRES_DB
            - name: DB_HOST
              value: {{ include "vexa.dbHostEffective" . | quote }}
            - name: DB_PORT
              value: {{ include "vexa.dbPortEffective" . | quote }}
            - name: DB_SSL_MODE
              value: {{ .Values.database.sslMode | quote }}
            - name: FLOWS_DB_NAME
              value: {{ .Values.flows.databaseName | quote }}
      {{- end }}
      containers:
        - name: flows-worker
          image: {{ include "vexa.flowsImage" . | quote }}
          # Composes VEXA_FLOWS_DB_URL from secretKeyRef-sourced parts (F-D5 item 1) rather than
          # a literal DSN in the Secret — see the file header. sslmode threads from database.sslMode
          # (F-D5 item 2); the target database is flows.databaseName (default "flows", separate
          # from the app database — set equal to database.name to share it, see values.yaml).
          command: ["/bin/sh", "-c"]
          args:
            - |
              export VEXA_FLOWS_DB_URL="postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${FLOWS_DB_NAME}?sslmode=${DB_SSL_MODE}"
              exec python -m flows_worker
          envFrom:
            - secretRef:
                name: {{ include "vexa.componentName" (list . "flows") }}
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              value: {{ include "vexa.dbHostEffective" . | quote }}
            - name: DB_PORT
              value: {{ include "vexa.dbPortEffective" . | quote }}
            - name: DB_SSL_MODE
              value: {{ .Values.database.sslMode | quote }}
            - name: FLOWS_DB_NAME
              value: {{ .Values.flows.databaseName | quote }}
            - name: VEXA_FLOWS_GATEWAY_URL
              value: "http://{{ include "vexa.componentName" (list . "gateway") }}:{{ .Values.gateway.service.port }}"
            {{- /* AGENT DOMAIN PRESENCE (F-D5 item 4): unset means "no agent domain deployed" to
            flows_config.py (a `capability` key, degrades via flows_steps.common.domain_present) —
            NOT a URL pointed at a Service that does not exist in a no-agents estate.
            THE GUARD AND THE VALUE WERE INVERTED (A12): the key rendered as an EMPTY STRING
            exactly when agentApi.enabled, and `_is_set` reads "" as UNSET — so a chart that runs
            the agent domain told flows it does not, and every agent step answered `not_present`
            on an estate where agent-api was up. The guard was right; the value was the empty
            half of it. Omitted when disabled, the SERVICE ADDRESS when enabled. */}}
            {{- if .Values.agentApi.enabled }}
            - name: VEXA_FLOWS_AGENT_API_URL
              value: "http://{{ include "vexa.componentName" (list . "agent-api") }}:{{ .Values.agentApi.service.port }}"
            {{- end }}
            - name: VEXA_FLOWS_ADMIN_API_URL
              value: "http://{{ include "vexa.componentName" (list . "admin-api") }}:{{ .Values.adminApi.service.port }}"
            {{- /* THE TERMINAL'S PUBLIC ORIGIN (F-D5 item 5): unset means "no terminal adapter" to
            flows_config.py (a `capability` key) — nothing is mailed with a link and any step that
            would compose one refuses, naming the key. Previously this ALWAYS resolved to a URL
            (terminal.publicUrl, or the in-cluster Service address as a fallback) even when
            terminal.enabled=false, which is a dead link in every mail a no-terminal deployment
            sends — there is no terminal there to answer it. */}}
            {{- if .Values.terminal.enabled }}
            - name: VEXA_UI_URL
              value: {{ .Values.terminal.publicUrl | default (printf "http://%s:%v" (include "vexa.componentName" (list . "terminal")) .Values.terminal.service.port) | quote }}
            {{- end }}
            - name: VEXA_FLOWS_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: ADMIN_API_TOKEN
          {{- /* NO PROBE, and that is a documented gap rather than an oversight (A12/E4).
          `flows_worker/__main__.py` and `flows_integrations.mailbox` are `while True: tick();
          sleep()` loops with no server and no port — there is nothing for an httpGet to reach,
          and an `exec` probe over the same Postgres these processes already poll would report
          the database's health, not the loop's. The compose file says the same thing about the
          same two processes. Giving these a real liveness surface needs a health endpoint in
          flows itself; that is E4's work, not this template's. */}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vexa.componentName" (list . "flows-mailbox") }}
  labels: {app.kubernetes.io/component: flows-mailbox}
spec:
  replicas: 1   # the IMAP cursor is single-writer by design
  selector:
    matchLabels: {app.kubernetes.io/component: flows-mailbox}
  template:
    metadata:
      labels: {app.kubernetes.io/component: flows-mailbox}
    spec:
      {{- /* F192 — the SAME ensure-db initContainer flows-worker carries above: every Deployment
      that opens VEXA_FLOWS_DB_URL must be able to create the database it opens, not rely on
      flows-worker's pod happening to have won the startup race first (k8s makes no promise
      about pod start order). Reconciled to the SAME shape as flows-worker's block (merge of
      #1505/F192 with #1509/F-D5, which landed on top of it): the CREATEDB-tolerant bootstrap
      against flows.databaseName, guarded by the same "nothing to do when it equals the app's
      own database" skip. See flows-worker above for the full reasoning in one place. A Helm
      TEMPLATE comment, not a YAML one — a plain "#" line here renders into every values-name
      permutation regardless of the if-guard below, including the word "ensure-db" the guard
      exists to keep OUT of the no-op case. */}}
      {{- if ne .Values.flows.databaseName .Values.database.name }}
      initContainers:
        - name: ensure-db
          image: {{ include "vexa.flowsImage" . | quote }}
          command: ["python", "-c"]
          args:
            - |
              import os
              from sqlalchemy import create_engine, text
              name = os.environ["FLOWS_DB_NAME"]
              admin_url = (
                  "postgresql+psycopg://" + os.environ["DB_USER"] + ":" + os.environ["DB_PASSWORD"]
                  + "@" + os.environ["DB_HOST"] + ":" + os.environ["DB_PORT"] + "/" + os.environ["DB_NAME"]
                  + "?sslmode=" + os.environ["DB_SSL_MODE"]
              )
              e = create_engine(admin_url, isolation_level="AUTOCOMMIT")
              with e.connect() as c:
                  exists = c.execute(text("SELECT 1 FROM pg_database WHERE datname=:n"), {"n": name}).first()
                  if not exists:
                      try:
                          c.execute(text('CREATE DATABASE "' + name + '"'))
                          print("created database " + name)
                      except Exception as exc:
                          exists = c.execute(text("SELECT 1 FROM pg_database WHERE datname=:n"), {"n": name}).first()
                          if not exists:
                              raise RuntimeError(
                                  "database " + repr(name) + " does not exist and this role could "
                                  "not create it (" + repr(exc) + ") — pre-create it "
                                  "(CREATE DATABASE ...) or grant CREATEDB"
                              ) from exc
                          print("database " + name + " already exists (created by another process)")
                  else:
                      print("database " + name + " already exists")
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}
                  key: POSTGRES_DB
            - name: DB_HOST
              value: {{ include "vexa.dbHostEffective" . | quote }}
            - name: DB_PORT
              value: {{ include "vexa.dbPortEffective" . | quote }}
            - name: DB_SSL_MODE
              value: {{ .Values.database.sslMode | quote }}
            - name: FLOWS_DB_NAME
              value: {{ .Values.flows.databaseName | quote }}
      {{- end }}
      containers:
        - name: flows-mailbox
          image: {{ include "vexa.flowsImage" . | quote }}
          # See flows-worker above (F-D5) — same DSN-composition wrapper, same reasoning.
          command: ["/bin/sh", "-c"]
          args:
            - |
              export VEXA_FLOWS_DB_URL="postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${FLOWS_DB_NAME}?sslmode=${DB_SSL_MODE}"
              exec python -m flows_integrations.mailbox
          envFrom:
            - secretRef:
                name: {{ include "vexa.componentName" (list . "flows") }}
          # THE MAILBOX ASKS ADMIN-API WHO A SENDER IS, and it had no way to reach it: this pod
          # took only the secret, so `ADMIN_API` fell back to its localhost default and every
          # lookup failed. Harmless while an unknown sender was onboarded anyway; load-bearing
          # now, because "is this address already a user?" is the first half of the intake's
          # authorization decision (R-B12) — a known user outside the domain would otherwise be
          # quarantined on a lookup that never reached anything.
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              value: {{ include "vexa.dbHostEffective" . | quote }}
            - name: DB_PORT
              value: {{ include "vexa.dbPortEffective" . | quote }}
            - name: DB_SSL_MODE
              value: {{ .Values.database.sslMode | quote }}
            - name: FLOWS_DB_NAME
              value: {{ .Values.flows.databaseName | quote }}
            - name: VEXA_FLOWS_GATEWAY_URL
              value: "http://{{ include "vexa.componentName" (list . "gateway") }}:{{ .Values.gateway.service.port }}"
            {{- if .Values.agentApi.enabled }}
            - name: VEXA_FLOWS_AGENT_API_URL
              value: "http://{{ include "vexa.componentName" (list . "agent-api") }}:{{ .Values.agentApi.service.port }}"
            {{- end }}
            - name: VEXA_FLOWS_ADMIN_API_URL
              value: "http://{{ include "vexa.componentName" (list . "admin-api") }}:{{ .Values.adminApi.service.port }}"
            {{- if .Values.terminal.enabled }}
            - name: VEXA_UI_URL
              value: {{ .Values.terminal.publicUrl | default (printf "http://%s:%v" (include "vexa.componentName" (list . "terminal")) .Values.terminal.service.port) | quote }}
            {{- end }}
            - name: VEXA_FLOWS_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: ADMIN_API_TOKEN
          {{- /* NO PROBE, and that is a documented gap rather than an oversight (A12/E4).
          `flows_worker/__main__.py` and `flows_integrations.mailbox` are `while True: tick();
          sleep()` loops with no server and no port — there is nothing for an httpGet to reach,
          and an `exec` probe over the same Postgres these processes already poll would report
          the database's health, not the loop's. The compose file says the same thing about the
          same two processes. Giving these a real liveness surface needs a health endpoint in
          flows itself; that is E4's work, not this template's. */}}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vexa.componentName" (list . "flows-api") }}
  labels: {app.kubernetes.io/component: flows-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: flows-api}
  template:
    metadata:
      labels: {app.kubernetes.io/component: flows-api}
    spec:
      {{- /* F192 — see the identical block on flows-worker above (reconciled the same way as
      flows-mailbox's — merge of #1505/F192 with #1509/F-D5): every Deployment that opens
      VEXA_FLOWS_DB_URL must be able to create the database it opens itself, not rely on
      flows-worker's pod happening to have won the startup race first. Helm TEMPLATE comment,
      not YAML — see the note on flows-mailbox's identical block for why. */}}
      {{- if ne .Values.flows.databaseName .Values.database.name }}
      initContainers:
        - name: ensure-db
          image: {{ include "vexa.flowsImage" . | quote }}
          command: ["python", "-c"]
          args:
            - |
              import os
              from sqlalchemy import create_engine, text
              name = os.environ["FLOWS_DB_NAME"]
              admin_url = (
                  "postgresql+psycopg://" + os.environ["DB_USER"] + ":" + os.environ["DB_PASSWORD"]
                  + "@" + os.environ["DB_HOST"] + ":" + os.environ["DB_PORT"] + "/" + os.environ["DB_NAME"]
                  + "?sslmode=" + os.environ["DB_SSL_MODE"]
              )
              e = create_engine(admin_url, isolation_level="AUTOCOMMIT")
              with e.connect() as c:
                  exists = c.execute(text("SELECT 1 FROM pg_database WHERE datname=:n"), {"n": name}).first()
                  if not exists:
                      try:
                          c.execute(text('CREATE DATABASE "' + name + '"'))
                          print("created database " + name)
                      except Exception as exc:
                          exists = c.execute(text("SELECT 1 FROM pg_database WHERE datname=:n"), {"n": name}).first()
                          if not exists:
                              raise RuntimeError(
                                  "database " + repr(name) + " does not exist and this role could "
                                  "not create it (" + repr(exc) + ") — pre-create it "
                                  "(CREATE DATABASE ...) or grant CREATEDB"
                              ) from exc
                          print("database " + name + " already exists (created by another process)")
                  else:
                      print("database " + name + " already exists")
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}
                  key: POSTGRES_DB
            - name: DB_HOST
              value: {{ include "vexa.dbHostEffective" . | quote }}
            - name: DB_PORT
              value: {{ include "vexa.dbPortEffective" . | quote }}
            - name: DB_SSL_MODE
              value: {{ .Values.database.sslMode | quote }}
            - name: FLOWS_DB_NAME
              value: {{ .Values.flows.databaseName | quote }}
      {{- end }}
      containers:
        - name: flows-api
          image: {{ include "vexa.flowsImage" . | quote }}
          # See flows-worker above (F-D5) — same DSN-composition wrapper, same reasoning.
          command: ["/bin/sh", "-c"]
          args:
            - |
              export VEXA_FLOWS_DB_URL="postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${FLOWS_DB_NAME}?sslmode=${DB_SSL_MODE}"
              exec python -m flows_integrations.flows_api
          ports:
            - containerPort: 18200
          envFrom:
            - secretRef:
                name: {{ include "vexa.componentName" (list . "flows") }}
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.postgresCredentialsSecretName" . | quote }}
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              value: {{ include "vexa.dbHostEffective" . | quote }}
            - name: DB_PORT
              value: {{ include "vexa.dbPortEffective" . | quote }}
            - name: DB_SSL_MODE
              value: {{ .Values.database.sslMode | quote }}
            - name: FLOWS_DB_NAME
              value: {{ .Values.flows.databaseName | quote }}
            {{- /* THE LISTENER. flows_api.py defaults VEXA_FLOWS_API_HOST to 127.0.0.1 on purpose
            (it also runs as a host lane on the dogfood rig, where 0.0.0.0 would publish that box's
            every interface). In a POD, loopback is this container's loopback: the Service below
            selects the pod and connects to nothing, and every probe times out. The compose service
            says 0.0.0.0 in its own environment for exactly this reason; this Deployment did not,
            so flows-api was unreachable in-cluster from the first render (A12). */}}
            - name: VEXA_FLOWS_API_HOST
              value: "0.0.0.0"
            - name: VEXA_FLOWS_API_PORT
              value: "18200"
            {{- /* THE DOORS AND THE CREDENTIALS THE WORKER AND MAILBOX ALREADY CARRY (A12). This
            container had NONE of them, and VEXA_FLOWS_ADMIN_API_URL is `required-explicit` in
            flows' config.v1 — so `preflight()` raised at boot and flows-api crash-looped on any
            chart with flows.enabled=true. Same four values as the two lanes above, kept in the
            same order so a diff between the three containers reads as one list. */}}
            - name: VEXA_FLOWS_ADMIN_API_URL
              value: "http://{{ include "vexa.componentName" (list . "admin-api") }}:{{ .Values.adminApi.service.port }}"
            - name: VEXA_FLOWS_GATEWAY_URL
              value: "http://{{ include "vexa.componentName" (list . "gateway") }}:{{ .Values.gateway.service.port }}"
            {{- if .Values.agentApi.enabled }}
            - name: VEXA_FLOWS_AGENT_API_URL
              value: "http://{{ include "vexa.componentName" (list . "agent-api") }}:{{ .Values.agentApi.service.port }}"
            {{- end }}
            {{- if .Values.terminal.enabled }}
            - name: VEXA_UI_URL
              value: {{ .Values.terminal.publicUrl | default (printf "http://%s:%v" (include "vexa.componentName" (list . "terminal")) .Values.terminal.service.port) | quote }}
            {{- end }}
            - name: VEXA_FLOWS_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vexa.adminTokenSecretName" . }}
                  key: ADMIN_API_TOKEN
          {{- /* PROBES. `/health` is liveness-grade only — it answers ok with Postgres
          unreachable (E4 in the 0.12.27 review) — so readiness here means "the process is
          listening and serving", not "the tier is well". That is still strictly more than the
          nothing this Deployment carried: without a readiness gate the Service routes to a pod
          that has not finished binding, and without liveness a wedged process is never restarted.
          A capability-row readiness that can actually fail on a database outage is E4's, not
          this template's. */}}
          startupProbe:
            httpGet: {path: /health, port: 18200}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: 18200}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 18200}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vexa.componentName" (list . "flows-api") }}
spec:
  selector: {app.kubernetes.io/component: flows-api}
  ports:
