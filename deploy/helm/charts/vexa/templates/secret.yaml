{{- if not .Values.secrets.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vexa.componentName" (list . "secrets") }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* Generated-at-install secrets keep their first value across upgrades: an explicit value
  wins, then the one already in the release's Secret, and only a brand-new install mints one. */}}
  {{- $current := (lookup "v1" "Secret" .Release.Namespace (include "vexa.componentName" (list . "secrets"))) | default dict }}
  {{- $currentData := (get $current "data") | default dict }}
  ADMIN_API_TOKEN: {{ .Values.secrets.adminApiToken | quote }}
  # No default: `vexa-internal-secret` is published in this repository and is the exact value the
  # internal tier compares against, so a chart default IS an open internal tier (F95). Mint one
  # (`openssl rand -hex 32`) and pass --set secrets.internalApiSecret=..., or use
  # secrets.existingSecretName.
  INTERNAL_API_SECRET: {{ required "secrets.internalApiSecret is required — mint one with `openssl rand -hex 32` (or set secrets.existingSecretName); there is no default, the internal tier is authority" .Values.secrets.internalApiSecret | quote }}
  # gateway-identity.v1 — the gateway signs the identity it resolved with this; agent-api and meeting-api
  # verify it and refuse an x-user-* header without it. All three refuse to boot when it is empty.
  VEXA_GATEWAY_IDENTITY_SECRET: {{ .Values.secrets.gatewayIdentitySecret | default ((get $currentData "VEXA_GATEWAY_IDENTITY_SECRET") | b64dec) | default (randAlphaNum 64) | quote }}
  # The worker toolbelt — agent-api signs each worker's delegation token with it and identity
  # (admin-api) verifies it, so the gateway authenticates a worker's tool calls.
  VEXA_MCP_DELEGATION_SECRET: {{ .Values.secrets.mcpDelegationSecret | default ((get $currentData "VEXA_MCP_DELEGATION_SECRET") | b64dec) | default (randAlphaNum 64) | quote }}
  TRANSCRIPTION_SERVICE_TOKEN: {{ .Values.secrets.transcriptionServiceToken | quote }}
  VEXA_SERVICE_AUTHORITY_SECRET: {{ .Values.secrets.serviceAuthoritySecret | quote }}
  VEXA_SYSTEM_WEBHOOK_SECRET: {{ .Values.secrets.systemWebhookSecret | quote }}
  VEXA_DISPATCH_SIGNING_KEY: {{ .Values.secrets.dispatchSigningKey | default "dev-dispatch-signing-key" | quote }}
  {{- /*
  NEXTAUTH_SECRET signs the terminal's sign-in cookies and, through a derived key, every emailed
  sign-in link, so it has no published default. A value given in secrets.nextauthSecret must be
  32+ bytes and not one this repository ever shipped. Left empty, the chart keeps the value its
  own Secret already holds (lookup, so an upgrade does not sign everybody out) and otherwise mints
  one. `helm template` cannot look the Secret up and mints a new value each render: set
  secrets.nextauthSecret (or secrets.existingSecretName) when a GitOps tool renders the chart.
  */}}
  {{- $published := list "dev-nextauth-secret" "vexa-dev-nextauth-secret" "vexa-dev-secret" "vexa-dev-jwt-secret" "vexa-dash-nextauth-secret-dev" "vexa-dash-jwt-secret-dev" "vexa-lite-nextauth-secret" "vexa-lite-jwt-secret" "default-secret-change-me" "change-me" "change_me" "changeme" "secret" }}
  {{- $nextauth := .Values.secrets.nextauthSecret | default "" }}
  {{- if $nextauth }}
  {{- if or (has (lower (trim $nextauth)) $published) (lt (len $nextauth) 32) }}
  {{- fail "secrets.nextauthSecret must be 32+ bytes and not a value published in the Vexa repository — mint one with `openssl rand -hex 32`, or leave it empty and the chart generates one" }}
  {{- end }}
  {{- else }}
  {{- $current := lookup "v1" "Secret" .Release.Namespace (include "vexa.componentName" (list . "secrets")) }}
  {{- if and $current $current.data (hasKey $current.data "NEXTAUTH_SECRET") }}
  {{- $nextauth = index $current.data "NEXTAUTH_SECRET" | b64dec }}
  {{- end }}
  {{- if or (not $nextauth) (has (lower (trim $nextauth)) $published) (lt (len $nextauth) 32) }}
  {{- $nextauth = randAlphaNum 64 }}
  {{- end }}
  {{- end }}
  NEXTAUTH_SECRET: {{ $nextauth | quote }}
  # The credential store's key (R-E08). Empty is ALLOWED here and refused at boot only when
  # `vexaEnv` is production — a chart that made it required would break every development install
  # for a property those installs never claimed, and the refusal is meant to bite exactly where the
  # "encrypted at rest" sentence is load-bearing.
  VEXA_SECRETS_KEY: {{ .Values.secrets.secretsKey | default "" | quote }}
  {{- if .Values.secrets.botApiKey }}
  VEXA_BOT_API_KEY: {{ .Values.secrets.botApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.mailSmtpPassword }}
  VEXA_MAIL_SMTP_PASSWORD: {{ .Values.secrets.mailSmtpPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicAuthToken }}
  ANTHROPIC_AUTH_TOKEN: {{ .Values.secrets.anthropicAuthToken | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicBaseUrl }}
  ANTHROPIC_BASE_URL: {{ .Values.secrets.anthropicBaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.claudeCodeOauthToken }}
  CLAUDE_CODE_OAUTH_TOKEN: {{ .Values.secrets.claudeCodeOauthToken | quote }}
  {{- end }}
{{- end }}
---
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.credentialsSecretName | default "postgres-credentials" }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.database.name | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | default "postgres" | quote }}
{{- end }}
