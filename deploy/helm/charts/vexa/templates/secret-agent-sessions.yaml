{{- $ss := include "vexa.agentSessions" . | fromYaml }}
{{- if and $ss.active $ss.dbSecretGenerated }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $ss.dbSecret).data | default dict }}
# The session store role's password (ADR-0048): generated once, then reused (lookup returns the live
# Secret on every render). A hook ahead of everything (weight -10), so the agent-sessions-schema
# Job, which sets it on the role, finds it on the upgrade that turns the store on; re-created with
# the looked-up value, never a new one. agent-api logs in with it. A `helm template` pipeline cannot
# look anything up — set agentApi.sessions.existingSecret there.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ss.dbSecret }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-api
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  {{- if hasKey $existing "password" }}
  password: {{ index $existing "password" }}
  {{- else }}
  password: {{ randAlphaNum 64 | sha256sum | b64enc }}
  {{- end }}
{{- end }}
