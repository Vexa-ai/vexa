{{- /*
The postgres-password hook: moves the bundled database off a password published in this repository.

Rendered only on an upgrade whose credentials Secret still holds a published value (the chart's old
`postgres` default) or a rotation this hook began and did not finish. After the upgrade it:
  1. mints the new password once and records it in the Secret as POSTGRES_PASSWORD_NEXT;
  2. sets it on the database role, inside the postgres pod over the local socket (no old password);
  3. makes it the Secret's POSTGRES_PASSWORD and restarts the workloads that read it;
  4. removes POSTGRES_PASSWORD_NEXT.
Every step can run again: a failure at any point leaves NEXT in the Secret, so the next upgrade
renders this hook again and it finishes with the same value. Its ServiceAccount, Role and RoleBinding
are deleted whether it succeeds or fails (the failed Job stays, holding no rights, for its log). An external database
(postgres.enabled=false) is the operator's and is never touched. The value is never printed.
*/}}
{{- if and .Values.postgres.enabled (not .Values.database.existingSecret) }}
{{- $secretName := include "vexa.postgresCredentialsSecretName" . }}
{{- $current := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $data := (get ($current | default dict) "data") | default dict }}
{{- $password := (get $data "POSTGRES_PASSWORD") | default "" | b64dec }}
{{- $pending := hasKey $data "POSTGRES_PASSWORD_NEXT" }}
{{- $published := has (lower (trim $password)) (include "vexa.publishedDbPasswords" . | fromJsonArray) }}
{{- if and .Release.IsUpgrade $current (or $pending $published) }}
{{- $name := include "vexa.componentName" (list . "postgres-password") }}
{{- $pod := printf "%s-0" (include "vexa.componentName" (list . "postgres")) }}
{{- $consumers := list }}
{{- if .Values.adminApi.enabled }}{{ $consumers = append $consumers (include "vexa.componentName" (list . "admin-api")) }}{{ end }}
{{- if .Values.meetingApi.enabled }}{{ $consumers = append $consumers (include "vexa.componentName" (list . "meeting-api")) }}{{ end }}
{{- if .Values.pgbouncer.enabled }}{{ $consumers = append $consumers (include "vexa.componentName" (list . "pgbouncer")) }}{{ end }}
{{- if .Values.flows.enabled }}
{{- range $c := list "flows-worker" "flows-api" }}{{ $consumers = append $consumers (include "vexa.componentName" (list $ $c)) }}{{ end }}
{{- if include "vexa.flowsMailboxEnabled" . }}{{ $consumers = append $consumers (include "vexa.componentName" (list . "flows-mailbox")) }}{{ end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secretName | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: [{{ $pod | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: [{{ $pod | quote }}]
    verbs: ["create", "get"]
  {{- if $consumers }}
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: {{ $consumers | toJson }}
    verbs: ["get", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "vexa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres-password
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      {{- include "vexa.podSecurityContext" . | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rotate
          {{- include "vexa.containerSecurityContext" . | nindent 10 }}
          # The runtime image carries kubectl (its k8s backend uses it) and python.
          image: "{{ .Values.runtime.image.repository }}:{{ .Values.global.imageTag | default .Values.runtime.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: NS
              value: {{ .Release.Namespace | quote }}
            - name: SECRET
              value: {{ $secretName | quote }}
            - name: POD
              value: {{ $pod | quote }}
            - name: CONSUMERS
              value: {{ join " " $consumers | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              field() { kubectl -n "$NS" get secret "$SECRET" -o "jsonpath={.data.$1}" | base64 -d; }
              # The patch reaches kubectl on stdin (printf is the shell's own), never on a command line.
              setfield() { printf '{"data":{"%s":"%s"}}' "$1" "$(printf '%s' "$2" | base64 | tr -d '\n')" \
                | kubectl -n "$NS" patch secret "$SECRET" --type merge --patch-file /dev/stdin >/dev/null; }
              next="$(field POSTGRES_PASSWORD_NEXT || true)"
              if [ -z "$next" ]; then
                next="$(python -c 'import secrets; print(secrets.token_hex(32))')"
                setfield POSTGRES_PASSWORD_NEXT "$next"
              fi
              user="$(field POSTGRES_USER)"; db="$(field POSTGRES_DB)"
              tries=0
              until printf 'ALTER ROLE "%s" PASSWORD '"'"'%s'"'"';\n' "$user" "$next" \
                  | kubectl -n "$NS" exec -i "$POD" -c postgres -- psql -U "$user" -d "$db" -v ON_ERROR_STOP=1 -q; do
                tries=$((tries + 1)); [ "$tries" -lt 60 ] || { echo "the database did not take the new password" >&2; exit 1; }
                sleep 5
              done
              setfield POSTGRES_PASSWORD "$next"
              for d in $CONSUMERS; do kubectl -n "$NS" rollout restart "deployment/$d"; done
              kubectl -n "$NS" patch secret "$SECRET" --type json \
                -p '[{"op":"remove","path":"/data/POSTGRES_PASSWORD_NEXT"}]' >/dev/null
              echo "the database role was moved off a published password; its workloads are restarting"
{{- end }}
{{- end }}
