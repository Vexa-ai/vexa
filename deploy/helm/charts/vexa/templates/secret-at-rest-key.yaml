{{- if and (or .Values.adminApi.enabled .Values.meetingApi.enabled) (not (.Values.atRest).existingSecret) }}
{{- $name := include "vexa.componentName" (list . "at-rest-key") }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- if and .Release.IsUpgrade (not (hasKey $existing "at-rest.key")) }}
{{- fail (printf "atRest: upgrading, but the at-rest key Secret %s was not found. A new key would leave every sealed webhook secret unreadable, so this chart does not generate one on an upgrade. Restore that Secret, or set atRest.existingSecret to a Secret holding the install's key (`at-rest.key`). GitOps renders (`helm template`, ArgoCD) cannot look it up: set atRest.existingSecret there." $name) }}
{{- end }}
# MIGRATION-0015: the at-rest sealing key (64 hex characters, AES-256-GCM) admin-api and meeting-api
# seal per-user webhook signing secrets with (users.data, meetings.data). Generated once, then reused:
# lookup returns the live Secret on every upgrade and the resource-policy keeps it through an
# uninstall — a new key would leave every sealed secret unreadable. A file apart from the database:
# never in it, never in a database backup. A `helm template` pipeline cannot look anything up — set
# atRest.existingSecret there (a Secret with key `at-rest.key`, `openssl rand -hex 32`).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
    app.kubernetes.io/component: at-rest-key
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if hasKey $existing "at-rest.key" }}
  at-rest.key: {{ index $existing "at-rest.key" }}
  {{- else }}
  at-rest.key: {{ printf "%s\n" (randAlphaNum 64 | sha256sum) | b64enc }}
  {{- end }}
{{- end }}
