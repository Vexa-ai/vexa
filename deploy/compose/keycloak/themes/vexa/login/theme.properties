# Vexa login theme — extends Keycloak's stock keycloak.v2 (PatternFly v5) and repaints it with the
# terminal's own tokens from clients/terminal/src/app/globals.css, so the sign-in hop does not look
# like a different product. `styles` REPLACES the parent's list, so keycloak.v2's own css/styles.css
# is restated here first and ours is appended; stylesCommon (PatternFly) is inherited untouched.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/vexa.css
