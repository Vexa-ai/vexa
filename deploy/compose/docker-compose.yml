  # flows-worker — THE reaction engine (F190): claim → one step → receipts → advance, on the same
  # `reaction` table `flows-api` admits facts into. Same image, same configuration, different
  # command — see "ONE IMAGE, THREE ENTRYPOINTS" above `flows-api`. NOT behind a profile, unlike
  # `flows-mailbox`: the mailbox is an optional intake gated on a real IMAP credential, but a
  # deployment that runs `flows-api` and never runs the process that advances what it admits is
  # not an optional shape, it is silently broken — every reaction would sit `pending` forever.
  #
  # NO PORT, NO HTTP HEALTHCHECK: `flows_worker/__main__.py` has no server, it is
  # `while True: tick(...); sleep(POLL_S)`. Its liveness is the `flows-worker up · N flows ·
  # M steps` line it prints on boot, then the reaction rows it advances — there is no `/health` to
  # poll, so this service carries none, exactly like `flows-mailbox` above it.
