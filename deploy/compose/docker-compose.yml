  # MCP service — the Model Context Protocol front for the PUBLIC API (v0.12 port of 0.10.6
  # services/mcp). Stateless: every tool call forwards the caller's key to the gateway as
  # X-API-Key. Fronted at the gateway edge under /mcp (#795) — an MCP client points at the
  # gateway's public port like every other Vexa client. The direct host port below stays for
  # local debugging (bypasses the edge, so it bypasses the edge's auth too).
  mcp:
    build:
      context: ../../core/meetings/services/mcp
      dockerfile: Dockerfile
    image: vexaai/v012-mcp:${IMAGE_TAG:-dev}
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-18010}:8010"
    environment:
      - GATEWAY_URL=http://gateway:8000
      - PORT=8010
      # ── assembly (PRD decision 40) ─────────────────────────────────────────────────────────
      # The domains this deployment carries. A domain whose URL is set is ASKED for its tool
      # manifest at /.well-known/mcp-tools.json and its tools join the one MCP surface; a domain
      # whose URL is unset is never asked and its tools are simply absent. That is the whole of the
      # eight-configuration story — identity plus any subset of meetings, flows and agent — and it
      # needs no profile name, because a profile name would be a second place to say what these
      # URLs already say.
      - ADMIN_API_URL=http://admin-api:8001
      - MEETING_API_URL=http://meeting-api:8080
      # The agent domain — the same presence signal (and the same default) the gateway reads: this
      # full profile runs agents, so its tools (Connections, the person's clock, chat naming, the
      # workspace verbs) join the surface every worker's toolbelt reaches. Empty = no-agents.
      - AGENT_API_URL=${AGENT_API_URL:-http://agent-api:8100}
      # DEFAULTS TO THE SERVICE. It used to default to empty, so a stack that ran flows still
      # assembled without its tools unless somebody supplied a URL by hand — which is how a
      # docker bridge address came to be the answer. Override to point at a flows elsewhere;
      # set it empty to run a deployment that genuinely does not carry the domain.
      - FLOWS_API_URL=${VEXA_FLOWS_API_URL:-http://flows-api:8200}
      # flows_submit / flow_lifecycle are `auth: admin` (core/flows/mcp.tools.v1.json): flows-api's
      # own `POST /flows` and `POST /flows/{name}/{version}/{action}` are gated by ITS operator key
      # (flows_api.auth), not the caller's credential, so THIS service needs its own copy to forward
      # — the same key flows-api itself holds, below. Unset (the default) is a legitimate "this
      # deployment does not author flows through the edge" — but if FLOWS_API_URL names a live flows
      # and this is empty, assembly REFUSES to boot rather than list two tools their own door would
      # 401 (manifest.py's `assemble()`; the rule pre-dates these two tools, they are its first
      # payer).
      - VEXA_FLOWS_API_KEY=${VEXA_FLOWS_API_KEY:-}
      # A private deployment mounts its own manifests here — billing, seats, entitlement — and they
      # are assembled exactly like the OSS ones, competing for names in the same space so a mount
      # can collide but never shadow. EMPTY IS THE OSS PRODUCT, exactly.
      - VEXA_MCP_MANIFEST_DIR=${VEXA_MCP_MANIFEST_DIR:-}
      - VEXA_ENV=${VEXA_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Same declared-jitsi-hosts setting meeting-api reads — the two parsers must agree.
      - VEXA_JITSI_HOSTS=${VEXA_JITSI_HOSTS:-}
      # report_issue ticket sink. Unset (the default) → the tool answers 503 "not configured"
      # and nothing else changes; set the URL to let calling agents file tickets to your webhook.
      #
      # POINT THIS AT A DEDICATED TICKETS REPO, NEVER AN OPERATIONAL ONE. Ticket bodies are
      # third-party text: agent- and customer-submitted, data and never instruction. An
      # operational repo's issues are read as work signal by planning and automation loops, so
      # filing untrusted text there injects it straight into those loops. A dedicated (private)
      # tickets repo enforces at the storage layer what the handler only promises. The token
      # should be fine-grained, SINGLE-REPO, `issues: write` only, and supplied from a secret
      # store (k8s `secretKeyRef` / an env file), never inlined here.
      #
      # VEXA_TICKET_SINK_FORMAT: `raw` (default) POSTs the ticket JSON to an opaque webhook.
      # `github` maps it to POST /repos/{owner}/{repo}/issues so an issue tracker IS the sink.
      - VEXA_TICKET_SINK_URL=${VEXA_TICKET_SINK_URL:-}
      - VEXA_TICKET_SINK_TOKEN=${VEXA_TICKET_SINK_TOKEN:-}
      - VEXA_TICKET_SINK_FORMAT=${VEXA_TICKET_SINK_FORMAT:-}
      - VEXA_TICKET_SINK_LABELS=${VEXA_TICKET_SINK_LABELS:-}
      - VEXA_TICKET_FINGERPRINT_SALT=${VEXA_TICKET_FINGERPRINT_SALT:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8010/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    depends_on:
      gateway:
        condition: service_healthy
      # ASSEMBLY IS ONE-SHOT AND IT IS AT BOOT. `discover()` asks each configured domain for its
      # `/.well-known/mcp-tools.json` exactly once; a domain that is configured but not yet
      # LISTENING contributes nothing and is never asked again, so the server comes up healthy,
      # permanently missing that domain's tools. On a cold `docker compose up` that races
      # flows-api — and flows carries `whats_waiting`, the tool this server's own instructions
      # name as every session's FIRST call. Waiting for its health endpoint costs a few seconds
      # once and removes the race; it does not make flows a boot requirement for a deployment
      # that does not run it (a stack without the flows services has no such dependency to wait
      # on, and `FLOWS_API_URL=` is still how you say you do not carry the domain).
      flows-api:
        condition: service_healthy
      # Same reason, for the agent domain's tools: an agent-api still starting when this boots would
      # cost every worker its agent tools for the life of the process.
      agent-api:
        condition: service_healthy
    networks: [vexa]
    restart: unless-stopped

  # The user-facing web UI (Next.js custom server). Proxies /ws → gateway and REST → agent-api/admin-api.
  # The terminal is the front door for humans; the gateway remains the API front door for programmatic use.
  terminal:
    build:
      context: ../../clients/terminal
      dockerfile: Dockerfile
      args:
        # Google Analytics 4 measurement id, baked into the client bundle at build time (NEXT_PUBLIC_*).
        # Set GA_MEASUREMENT_ID in .env, then rebuild the terminal image. Empty → GA stays off.
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
        # Terminal mode, baked at build time (NEXT_PUBLIC_* — see clients/terminal/src/app/mode.ts).
        # "meetings" = meetings-only terminal; "minutes" = the minutes terminal; empty = the full
        # default. WIRED, not commented out (F67): while this line was a comment the ONLY way to
        # build a non-default variant was a direct `docker build --build-arg`, so `docker compose
        # build terminal` silently produced the default one — which is exactly what shipped under a
        # `-minutes` tag on 2026-09-02. Set TERMINAL_MODE in .env (or in the environment) and
        # rebuild; the resulting image carries `ai.vexa.terminal.mode`, and the swap guard reads
        # that label rather than trusting the tag.
        NEXT_PUBLIC_TERMINAL_MODE: ${TERMINAL_MODE:-}
        # Bot display name baked into the bundle. Leave commented: the terminal then omits bot_name and
        # meeting-api's DEFAULT_BOT_NAME (above) names the bot at runtime, renameable with a restart.
        # Uncomment + REBUILD only to pin a name into the image, which then wins over DEFAULT_BOT_NAME:
        # NEXT_PUBLIC_DEFAULT_BOT_NAME: ${TERMINAL_BOT_NAME:-}
        # Runtime node_modules flavor (clients/terminal/Dockerfile): prod (default, pruned) or
        # dev (full tree). Set TERMINAL_RUNTIME_DEPS=dev in .env on hosts that run the terminal
        # under the hot overlay's NODE_ENV=development — dev-mode Next needs the dev toolchain at
        # runtime and otherwise npm-installs it AT BOOT (slow, network-dependent, currently broken).
        RUNTIME_DEPS: ${TERMINAL_RUNTIME_DEPS:-prod}
    image: vexaai/v012-terminal:${IMAGE_TAG:-dev}
    ports:
      - "127.0.0.1:${TERMINAL_PORT:-13000}:3000"
    environment:
      - NODE_ENV=production
      # HTTP scheme: the terminal's REST proxy fetches GATEWAY_URL as http; server.mjs converts it to
      # ws:// itself for the /ws upgrade. ws:// here would break the REST proxy (502 fetch failed).
      - GATEWAY_URL=http://gateway:8000
      - AGENT_API_URL=http://agent-api:8100
      - VEXA_ADMIN_API_URL=http://admin-api:8001
      - VEXA_API_URL=http://gateway:8000
      - VEXA_ADMIN_API_KEY=${ADMIN_TOKEN:-}
      - VEXA_BOT_API_KEY=${VEXA_BOT_API_KEY:-}
      # NO PLACEHOLDER FALLBACK. F95 removed the published `vexa-internal-secret` default from
      # every service that REFUSES it at boot; these two lines kept it, so an unconfigured stack
      # still PRESENTED the published literal as internal-tier authority. Unset is unset (A19).
      - VEXA_INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      # Declared self-hosted Jitsi hostnames — served to the client link parser
      # (/api/meeting/jitsi-hosts) so pasted links on these hosts are recognized in the UI,
      # matching meeting-api's and mcp's parsers (same setting).
      - VEXA_JITSI_HOSTS=${VEXA_JITSI_HOSTS:-}
      # Composer mic dictation (/api/stt) — same STT service the meeting pipeline uses; token stays
      # server-side. Empty → the mic button reports "not configured" instead of failing silently.
      # MODEL rides along so dictation hits a validating backend with the same id as the bots.
      - TRANSCRIPTION_SERVICE_URL=${TRANSCRIPTION_SERVICE_URL:-}
      - TRANSCRIPTION_SERVICE_TOKEN=${TRANSCRIPTION_SERVICE_TOKEN:-}
      - TRANSCRIPTION_MODEL=${TRANSCRIPTION_MODEL:-}
      # REQUIRED, NO DEFAULT. It signs the sign-in cookies and (through a derived key) every emailed
      # sign-in link, so a published default would let anybody sign in. The terminal also refuses
      # to start on a value shorter than 32 bytes or one published in this repository.
      # `make all` mints one into .env; by hand: openssl rand -hex 32
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required - set it in deploy/compose/.env (openssl rand -hex 32)}
      # Optional: a separate key for the emailed sign-in link (32+ bytes, different from
      # NEXTAUTH_SECRET). Unset, the link key is derived from NEXTAUTH_SECRET.
      - MAGIC_LINK_SECRET=${MAGIC_LINK_SECRET:-}
      # Public origin when self-hosting behind a domain/reverse-proxy (e.g. https://vexa.example.com).
      # The emailed sign-in link is built ONLY from it (never from request headers): empty, the
      # terminal sends no link. Setting an https:// value also flips auth cookies to Secure.
      - NEXTAUTH_URL=${NEXTAUTH_URL:-}
      # Public proxy addresses whose X-Forwarded-For names the client, for the sign-in link's per-client
      # rate limit (private and loopback peers, e.g. a proxy on this host, are trusted already).
      - TERMINAL_TRUSTED_PROXIES=${TERMINAL_TRUSTED_PROXIES:-}
      # OAuth login providers (NextAuth). Each provider self-gates on its creds: set BOTH the id and
      # secret to expose that sign-in button on the login page; leave empty to hide it (the dev
      # type-any-email login still works). Register the redirect URI in the provider console:
      #   Google    → ${NEXTAUTH_URL}/api/auth/callback/google
      #   Microsoft → ${NEXTAUTH_URL}/api/auth/callback/microsoft
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      # Microsoft tenant: a tenant id (GUID) admits only that tenant's accounts; "common" admits any
      # tenant, but only sign-ins whose ID token carries `xms_edov: true` (an optional claim to add in
      # the app registration). Google sign-ins need a verified email.
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-common}
      # Sign-in link mail (clients/terminal/src/app/api/auth/mailer.ts) goes through the deployment's
      # mail relay — the VEXA_MAIL_SMTP_* family flows sends through too (declared in
      # clients/terminal/config.v1.json). Unset, the mailer dials localhost:1025 inside THIS
      # container, where nothing listens, and no link is delivered.
      - VEXA_MAIL_SMTP_HOST=${VEXA_MAIL_SMTP_HOST:-}
      - VEXA_MAIL_SMTP_PORT=${VEXA_MAIL_SMTP_PORT:-}
      - VEXA_MAIL_SMTP_FROM=${VEXA_MAIL_SMTP_FROM:-}
      - VEXA_MAIL_SMTP_USER=${VEXA_MAIL_SMTP_USER:-}
      - VEXA_MAIL_SMTP_PASSWORD=${VEXA_MAIL_SMTP_PASSWORD:-}
      - VEXA_MAIL_SMTP_SECURE=${VEXA_MAIL_SMTP_SECURE:-}
      - VEXA_MAIL_SMTP_TLS_INSECURE=${VEXA_MAIL_SMTP_TLS_INSECURE:-}
      # Connections panel (credential-broker.v1, ADR-0040). The terminal's server routes sign as
      # the `human` role for the signed-in person: consent, store, disconnect, delete. The public
      # origin is what browser POSTs must come from; unset, NEXTAUTH_URL's origin is used, and with
      # neither the panel refuses to save.
      - VEXA_CONNECTIONS_BROKER_URL=${VEXA_CONNECTIONS_BROKER_URL-http://credential-broker:8100}
      - VEXA_CONNECTIONS_HUMAN_KEY_FILE=/run/vexa-connections/human/key
      - VEXA_CONNECTIONS_PUBLIC_ORIGIN=${VEXA_CONNECTIONS_PUBLIC_ORIGIN:-}
    volumes:
      - connections-human-key:/run/vexa-connections/human:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    init: true
    depends_on:
      gateway:
        condition: service_healthy
      agent-api:
        condition: service_healthy
      connections-keys:
        condition: service_completed_successfully
    networks: [vexa, connections]
    restart: unless-stopped
  # ─── Connections: the credential broker (credential-broker.v1, ADR-0040) ────────────────────────
  # One-shot: generates the three role keys and the store key, each into its own volume, the first
  # time the stack starts, and leaves them alone afterwards. Each consumer mounts only its own:
  # agent-api the agent and git keys, the terminal the human key, the broker all four. No worker
  # mounts any of them. To rotate a key, remove its volume and restart the stack (rotating the
  # store key also makes every stored credential unreadable — reconnect them).
  connections-keys:
    # Same image as credential-broker (its Python is all this needs); the build is repeated so a
    # fresh `up --build` resolves it locally whichever of the two compose creates first.
    build:
      context: ../../core/agent/services/credential-broker
      dockerfile: Dockerfile
    image: vexaai/v012-credential-broker:${IMAGE_TAG:-dev}
    user: "0:0"
    command:
      - python
      - -c
      - |
        import pathlib, secrets
        for role in ("agent", "human", "git", "store"):
            key = pathlib.Path("/keys", role, "key")
            if not key.exists():
                key.write_text(secrets.token_hex(32) + "\n")
            key.chmod(0o444)
    volumes:
      - connections-agent-key:/keys/agent
      - connections-human-key:/keys/human
      - connections-git-key:/keys/git
      - connections-store-key:/keys/store
    network_mode: none
    restart: "no"
  credential-broker:
    build:
      context: ../../core/agent/services/credential-broker
      dockerfile: Dockerfile
    image: vexaai/v012-credential-broker:${IMAGE_TAG:-dev}
    environment:
      - PYTHONUNBUFFERED=1
      - VEXA_CONNECTIONS_AGENT_KEY_FILE=/run/vexa-connections/agent/key
      - VEXA_CONNECTIONS_HUMAN_KEY_FILE=/run/vexa-connections/human/key
      - VEXA_CONNECTIONS_GIT_KEY_FILE=/run/vexa-connections/git/key
      - VEXA_CONNECTIONS_STATE_DIR=/state
      # `local` (default): AES-256-GCM in the state volume, keyed from its own volume. `openbao`:
      # an OpenBao or Vault KV v2 mount you run — set the three OPENBAO values and mount the token.
      - VEXA_CONNECTIONS_STORE=${VEXA_CONNECTIONS_STORE:-local}
      - VEXA_CONNECTIONS_STORE_KEY_FILE=/run/vexa-connections/store/key
      - VEXA_CONNECTIONS_OPENBAO_ADDR=${VEXA_CONNECTIONS_OPENBAO_ADDR:-}
      - VEXA_CONNECTIONS_OPENBAO_TOKEN_FILE=${VEXA_CONNECTIONS_OPENBAO_TOKEN_FILE:-}
      - VEXA_CONNECTIONS_OPENBAO_MOUNT=${VEXA_CONNECTIONS_OPENBAO_MOUNT:-connections}
      # Gmail and Google Calendar consent. Usually the client the terminal signs in with; register
      # PRODUCT_REDIRECT (https://<your terminal>/api/auth/callback/google) on it. Unset, those two
      # providers answer "not configured" and custom-secret connections still work.
      - VEXA_CONNECTIONS_GOOGLE_CLIENT_ID=${VEXA_CONNECTIONS_GOOGLE_CLIENT_ID:-}
      - VEXA_CONNECTIONS_GOOGLE_CLIENT_SECRET=${VEXA_CONNECTIONS_GOOGLE_CLIENT_SECRET:-}
      - VEXA_CONNECTIONS_PRODUCT_REDIRECT=${VEXA_CONNECTIONS_PRODUCT_REDIRECT:-}
      # gateway-identity.v1: an agent-role call must carry the gateway's signature over the person,
      # forwarded by agent-api; the broker verifies it with this public key and cannot sign.
      - VEXA_GATEWAY_IDENTITY_PUBLIC_KEY_FILE=/run/vexa-identity/public/key.pem
    volumes:
      - connections-state:/state
      - connections-agent-key:/run/vexa-connections/agent:ro
      - connections-human-key:/run/vexa-connections/human:ro
      - connections-git-key:/run/vexa-connections/git:ro
      - connections-store-key:/run/vexa-connections/store:ro
      - identity-public-key:/run/vexa-identity/public:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      connections-keys:
        condition: service_completed_successfully
      identity-keys:
        condition: service_completed_successfully
    # `connections` is internal: only agent-api and the terminal join it, so a worker container
    # cannot open a socket to the broker. `connections-egress` is the broker's own way out to
    # Google and to the HTTPS services a person approved.
    networks: [connections, connections-egress]
    restart: unless-stopped
  # DEPRECATED — the 0.10 dashboard, kept as an OFF-BY-DEFAULT profile while it is still
  # load-bearing (#813). It is the multi-user web UI hosted production runs against the 0.12 core
  # (the wiring below is the hosted-proven one), and some flows (authenticated-session lifecycle,
  # browser-session provisioning) are only walkable through it today. The Terminal is the
  # first-class UI; this ships pinned so the UI users see belongs to a release again instead of
  # floating outside all of them. Start it explicitly:
  #     docker compose --profile dashboard up -d
  # Deprecation exit: when the Terminal covers the flows above, this block is deleted, not ported.
  # ─── The Anthropic front door (opt-in) ────────────────────────────────────────────────────────
  # The workspace agent's harness speaks the ANTHROPIC dialect (/v1/messages); self-hosted model
  # servers (vLLM, Ollama, llama.cpp) speak only the OPENAI dialect (/v1/chat/completions). Hosted
  # gateways such as OpenRouter serve both, so they need nothing here. This service is the missing
  # front door for a deployment running its OWN model — the whole product on your own hardware,
  # with no traffic leaving the estate.
  #
  # OFF by default: most deployments point at an endpoint that already serves both dialects.
  #     docker compose --profile llm-shim up -d llm-shim
  # See ./llm-shim/README.md — especially the extra_body block, load-bearing for a Qwen upstream.
  llm-shim:
    profiles: ["llm-shim"]
    # PINNED, deliberately: this is a third-party compatibility surface we vouch for, and both
    # dialects move. Bump it on purpose, never implicitly.
    image: ${LLM_SHIM_IMAGE:-litellm/litellm:main-v1.97.0}
    networks: [vexa, workers]     # MUST match the stack: workers resolve it on `workers`
    ports:
      - "127.0.0.1:${LLM_SHIM_PORT:-14000}:4000"
    volumes:
      - ${LLM_SHIM_CONFIG:-./llm-shim/config.yaml}:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - LLM_SHIM_MODEL=${LLM_SHIM_MODEL:-local-model}
      - LLM_SHIM_UPSTREAM=${LLM_SHIM_UPSTREAM:-http://host.docker.internal:8899/v1}
      - LLM_SHIM_UPSTREAM_KEY=${LLM_SHIM_UPSTREAM_KEY:-none}
      # A deployment may override the whole shim config with its own file:
      #   LLM_SHIM_CONFIG=./llm-shim/config.local.yaml docker compose --profile llm-shim up -d
      # Consumed only by that local file's fallback leg; empty (and unused) in a shipped deployment.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LLM_SHIM_FALLBACK_MODEL=${LLM_SHIM_FALLBACK_MODEL:-google/gemini-2.5-flash-lite}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # so an endpoint on the HOST is reachable from here
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  dashboard:
    profiles: ["dashboard"]
    image: ${DASHBOARD_IMAGE:-vexaai/dashboard:0.10.6.3.14}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-13001}:3000"
    environment:
      # Core wiring — identical shape to hosted production (vexa-platform chart), pointed at the
      # compose service DNS. The dashboard talks to the gateway's hosted-compat surface.
      - VEXA_API_URL=http://gateway:8000
      - VEXA_ADMIN_API_URL=http://admin-api:8001
      - VEXA_ADMIN_API_KEY=${ADMIN_TOKEN:-}
      - VEXA_PUBLIC_API_URL=${DASHBOARD_PUBLIC_API_URL:-http://localhost:18056}
      - NEXT_PUBLIC_VEXA_WS_URL=${DASHBOARD_PUBLIC_WS_URL:-ws://localhost:18056/ws}
      # Auth/session — self-hosted defaults: local registration on, no hosted-mode redirects.
      - NEXTAUTH_URL=${DASHBOARD_URL:-http://localhost:13001}
      - NEXT_PUBLIC_APP_URL=${DASHBOARD_URL:-http://localhost:13001}
      - NEXT_PUBLIC_BASE_URL=${DASHBOARD_URL:-http://localhost:13001}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - JWT_SECRET=${NEXTAUTH_SECRET:-}
      - ALLOW_REGISTRATIONS=${DASHBOARD_ALLOW_REGISTRATIONS:-true}
      - NEXT_PUBLIC_HOSTED_MODE=false
      - DEFAULT_BOT_NAME=${DEFAULT_BOT_NAME:-Vexa}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true
    depends_on:
      gateway:
        condition: service_healthy
    networks: [vexa]
    restart: unless-stopped

  # ─── The operator's search endpoint (opt-in) ──────────────────────────────────────────────────
  # SearXNG — the metasearch program that answers `WebSearch` for the openai-agent harness.
  #
  # SearXNG is AGPL-3.0 and is NOT part of Vexa. This block PINS an UNMODIFIED upstream image that
  # the OPERATOR pulls from SearXNG's own registry and runs as a SIDECAR, a separate service beside
  # the stack. No search code is built into, or redistributed inside, any vexaai/* artifact, so no
  # AGPL source-offer obligation attaches to Vexa's Apache-2.0 images — the obligation rests with
  # the upstream image the operator runs. A deliberate, reviewed sidecar allowance, declared in
  # image-licenses.json exactly as minio/minio is (ADR-0004).
  #
  # OFF by default: the harness speaks to ANY endpoint of this shape, and plenty of deployments
  # already run one or pay for Brave instead. Start it explicitly:
  #     docker compose --profile search up -d searxng
  # Then name it to the harness in .env (the runtime forwards these into every spawned worker):
  #     VEXA_SEARCH_URL=http://searxng:8080
  #     VEXA_SEARCH_DIALECT=searxng
  # See docs/docs/agent-web-search.mdx. Kubernetes operators run their own; there is no chart
  # component for this, by the same reasoning.
  searxng:
    profiles: ["search"]
    # PINNED BY DIGEST, deliberately: an unmodified third-party artifact we vouch for by its exact
    # bytes, not by a moving tag. Bump it on purpose, never implicitly. (= searxng/searxng:latest
    # at SearXNG 2026.9.5-c7f3080aa.)
    image: ${SEARXNG_IMAGE:-searxng/searxng@sha256:55e1fa15a63ff04e79e213e6aa2837549877b0c6d60757cdb633ae9111cb5fea}
    networks: [vexa, workers]     # MUST match the stack: workers resolve it on `workers`
    ports:
      - "127.0.0.1:${SEARXNG_HOST_PORT:-18481}:8080"
    volumes:
      # Read-only: the settings are ours to state, not the container's to rewrite. The image's
      # entrypoint only generates a settings.yml when none is mounted, so this file wins outright.
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      # The image defaults granian to `::`. A docker network without IPv6 has no `::` to bind to and
      # the server dies at socket init — the container comes up, stays up, and the port answers
      # nothing. Bind v4 explicitly; this line is load-bearing, not a preference.
      - GRANIAN_HOST=0.0.0.0
      # SearXNG reads the secret from the ENVIRONMENT and overrides server.secret_key with it. It
      # does NOT expand ${...} inside the mounted settings.yml, which is why the secret lives here
      # (docker does expand this) — see ./searxng/settings.yml. Override in .env for any deployment
      # that is not a local stack.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-dev-searxng-secret}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  storage-data:
  agent-workspaces:
  # Connections: the broker's state, and one volume per key so each service mounts only its own.
  connections-state:
  connections-agent-key:
  connections-human-key:
  connections-git-key:
  connections-store-key:
  # gateway-identity.v1: the gateway's signing key (the gateway only) and its public half.
  identity-signing-key:
  identity-public-key:

networks:
  # The control plane. No spawned bot or worker joins it.
  vexa:
    driver: bridge
  # Where the runtime puts meeting bots (DOCKER_NETWORK): meeting-api, redis and storage only.
  bots:
    driver: bridge
  # Where the runtime puts agent workers (DOCKER_WORKER_NETWORK): the gateway, redis, flows-api and
  # the opt-in llm-shim / searxng only.
  workers:
    driver: bridge
  # Connections: agent-api, the terminal and the broker only. internal = no route out, and no
  # worker container joins it.
  connections:
    driver: bridge
    internal: true
  connections-egress:
    driver: bridge
