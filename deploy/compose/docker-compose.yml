name: vexa-v012
# v0.12 control plane (P4). The carved analog of deploy/compose/docker-compose.yml (0.11):
# postgres:17 + valkey:8 + storage (versitygw) + storage-init infra, then the four long-running Python services —
# admin-api · runtime · meeting-api · gateway — each building its own slim uv-based image.
# Improvement over 0.11: EVERY service carries a healthcheck and depends_on waits on
# `condition: service_healthy` so the bring-up is ordered + observable.
#
# Bot is NOT a compose service: runtime spawns vexaai/vexa-bot:v012 (BROWSER_IMAGE) on demand via the
# mounted /var/run/docker.sock. That published ~3.6GB image is a REFERENCE here, never built.

services:
  # ─── Infrastructure ───────────────────────────────────────────────────────────────────────────
  redis:
    # Valkey (Linux Foundation BSD-3 fork of Redis 7.2.4): parity with the Lite witness surface
    # and off source-available Redis ≥7.4 (RSALv2/SSPLv1). Wire-compatible (RESP) — the service
    # name, REDIS_URL, and every consumer stay put; only the engine changes (#653).
    image: valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    # A PASSWORD ON THE DEFAULT USER, and none is no start. The services connect with it; a spawned
    # bot or worker never sees it — each connects as a Redis user of its own, limited to its own
    # keys, which agent-api and meeting-api define per spawn (REDIS_WORKLOAD_ACL).
    # mint-dev-env.sh (`make up` / `make all`) mints REDIS_PASSWORD into .env; hex, so it is URL-safe.
    entrypoint:
      - /bin/sh
      - -c
      - |
        case "$$REDIS_PASSWORD" in
          ""|changeme|change-me|CHANGE-ME|default|secret|password)
            echo "redis: REDIS_PASSWORD is unset or a value published in the Vexa repository - refusing to start." >&2
            echo "  Run deploy/compose/mint-dev-env.sh (make up does), or set REDIS_PASSWORD in .env (openssl rand -hex 32)." >&2
            exit 1;;
        esac
        exec docker-entrypoint.sh valkey-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # valkey-cli (the healthcheck, `docker compose exec redis valkey-cli`) authenticates with this.
      - REDISCLI_AUTH=${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks: [vexa, bots, workers]   # bots and workers keep their streams here
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    # NO DEFAULT PASSWORD, and a published one refuses the start. `postgres` shipped here as the
    # fallback and in .env.example, so every stack nobody configured shared one database password
    # anyone could read. mint-dev-env.sh (`make up` / `make all`) mints DB_PASSWORD into .env. An
    # install initialised with the old value must rotate it first — see the refusal message and
    # https://docs.vexa.ai/deployment#one-time-steps-after-upgrading.
    entrypoint:
      - /bin/sh
      - -c
      - |
        case "$$POSTGRES_PASSWORD" in
          ""|postgres|changeme|change-me|CHANGE-ME|default|secret|password)
            echo "postgres: DB_PASSWORD is unset or a value published in the Vexa repository - refusing to start." >&2
            echo "  New install: run deploy/compose/mint-dev-env.sh (make up does), or set DB_PASSWORD in .env (openssl rand -hex 32)." >&2
            echo "  Existing data: make -C deploy/compose rotate-db-password (it sets a new one in .env and inside the database)." >&2
            exit 1;;
        esac
        exec docker-entrypoint.sh "$$@"
      - --
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=60000"]
    environment:
      - POSTGRES_DB=${DB_NAME:-vexa}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-}
      # The backend operates only UTC time. Pin the DB clock to UTC so func.now()/server_default/
      # onupdate (the naive timestamp columns' server-side values, main's pattern) are guaranteed UTC.
      - TZ=UTC
      - PGTZ=UTC
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5458}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-vexa}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [vexa]
    restart: unless-stopped

  storage:
    # Object storage for recordings, and for authenticated bots' saved sessions when those point here:
    # versitygw (Apache-2.0) with its POSIX backend, pinned by digest. Buckets are directories under
    # data/ in the storage-data volume and every object is a plain file; S3 metadata (content type,
    # ETag) rides in extended attributes, so back the volume up with an attribute-preserving copy
    # (rsync -aX, cp -a). iam/ holds the gateway's account file. The admin API shares the S3 port.
    # meeting-api keeps its MINIO_* variable names; MINIO_ACCESS_KEY / MINIO_SECRET_KEY are this
    # server's root credentials. The host port is loopback-only and deliberately not MinIO's 9000,
    # so an upgrading install's old MinIO container can keep running beside it until its recordings
    # are copied (docs: /upgrade-from-minio).
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mkdir -p /srv/vexa-storage/data /srv/vexa-storage/iam && exec versitygw --port :9000 --health /health --iam-dir /srv/vexa-storage/iam --quiet posix /srv/vexa-storage/data
    environment:
      - ROOT_ACCESS_KEY=${MINIO_ACCESS_KEY:-vexa-access-key}
      - ROOT_SECRET_KEY=${MINIO_SECRET_KEY:-vexa-secret-key}
    ports:
      - "127.0.0.1:${STORAGE_HOST_PORT:-18900}:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - storage-data:/srv/vexa-storage
    networks: [vexa, bots]   # an authenticated bot restores its browser session from here
    restart: unless-stopped

  storage-init:
    # Checks the endpoint meeting-api uses (deploy/storage/storage_init.py, with its Python + boto3):
    # ensures the bucket exists and PUTs/GETs/DELETEs a probe under .vexa-storage-init/, comparing bytes.
    # Any failure holds meeting-api back. When authenticated bots point BOT_S3_ENDPOINT here, also
    # creates their scoped account and bucket policy limited to BOT_USERDATA_S3_PATH, then proves it.
    build:
      context: ../..
      dockerfile: core/meetings/services/meeting-api/Dockerfile
    image: vexaai/v012-meeting-api:${IMAGE_TAG:-dev}
    entrypoint: ["python", "/vexa-storage-tools/storage_init.py"]
    depends_on:
      storage:
        condition: service_healthy
    environment:
      - STORAGE_ENDPOINT=http://storage:9000
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-storage:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-vexa-access-key}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-vexa-secret-key}
      - MINIO_BUCKET=${MINIO_BUCKET:-vexa}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - BOT_S3_ENDPOINT=${BOT_S3_ENDPOINT:-}
      - BOT_S3_BUCKET=${BOT_S3_BUCKET:-}
      - BOT_S3_ACCESS_KEY=${BOT_S3_ACCESS_KEY:-}
      - BOT_S3_SECRET_KEY=${BOT_S3_SECRET_KEY:-}
      - BOT_USERDATA_S3_PATH=${BOT_USERDATA_S3_PATH:-}
    volumes:
      - ../storage:/vexa-storage-tools:ro
    networks: [vexa]

  # ─── Core services ────────────────────────────────────────────────────────────────────────────
  admin-api:
    build:
      context: ../../core/identity/services/admin-api
      dockerfile: Dockerfile
    image: vexaai/v012-admin-api:${IMAGE_TAG:-dev}
    ports:
      - "127.0.0.1:${ADMIN_API_PORT:-18057}:8001"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-vexa}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-}
      # NO `changeme` FALLBACK (A19). This token mints an API key for ANY user; a stack that came
      # up on the published literal handed the whole account plane to anyone who read the repo.
      # Unset now means UNSET — admin-api's config.v1 refuses the placeholder literals by name and
      # the admin surface answers 500 rather than accepting a secret everybody has.
      - ADMIN_API_TOKEN=${ADMIN_TOKEN:-}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      # identity resolves a worker's delegation token (vxd_) in /internal/validate, so the gateway and
      # flows authenticate a worker's tool calls without holding this key (agent_delegation).
      - VEXA_MCP_DELEGATION_SECRET=${VEXA_MCP_DELEGATION_SECRET:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Who may sign in to the terminal, besides existing users and admins: comma-separated exact
      # addresses and @domain entries ("@example.com,alice@example.org"). Empty = nobody new once an
      # admin exists. The admin can add more in the terminal's Settings → Sign-in; the effective list
      # is both. See .env.example.
      - VEXA_SIGNIN_ALLOW=${VEXA_SIGNIN_ALLOW:-}
      # The administrators, comma-separated exact addresses. They may always sign in, they are the
      # admins (the terminal's admin panel included), and naming them closes the admin claim. Set it
      # before first boot whenever the terminal is reachable from outside. Read by admin-api only:
      # the terminal asks admin-api who may sign in and who is an admin, and holds no list itself.
      - VEXA_ADMIN_EMAILS=${VEXA_ADMIN_EMAILS:-}
      # ── the publish edge (config.v1 class `publish-edge`) ──────────────────────────────────
      # Identity hands `onboarding.completed` to flows here. Same variable, same default-empty
      # shape as the mcp service's assembly URLs: EMPTY IS A PROFILE, not a misconfiguration —
      # a deployment with no flows domain still onboards people, and the fact stays stamped on
      # the person either way. The key authenticates the same edge; flows' POST /events is not open.
      - VEXA_FLOWS_API_URL=${VEXA_FLOWS_API_URL:-}
      - VEXA_FLOWS_API_KEY=${VEXA_FLOWS_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    networks: [vexa]
    restart: unless-stopped

  runtime:
    build:
      context: ../../core/runtime
      dockerfile: Dockerfile
    image: vexaai/v012-runtime:${IMAGE_TAG:-dev}
    # The runtime spawns bot containers via the host Docker socket (DockerBackend → socket API,
    # requests_unixsocket — no docker CLI in the image, like main).
    group_add:
      - "${DOCKER_GID:-0}"
    ports:
      - "127.0.0.1:${RUNTIME_API_PORT:-18090}:8090"
    # Provider auth (ANTHROPIC_AUTH_TOKEN + ANTHROPIC_BASE_URL) is sourced from .env via env_file so the
    # token/endpoint pair is a SINGLE SOURCE OF TRUTH the ambient shell cannot shadow. The runtime brokers
    # these into spawned agent containers, so a shell-shadowed base_url here would poison every agent.
    env_file:
      # required:false — a fresh checkout (CI, gate worktree) has no .env; the proof stack
      # must boot without LLM auth. On a real deploy the file exists and wins as before.
      - path: .env
        required: false
    environment:
      - BROWSER_IMAGE=${BROWSER_IMAGE:-vexaai/vexa-bot:${IMAGE_TAG:-dev}}
      # The per-dispatch WORKER image the runtime spawns (control-plane ⊥ worker split). AGENT_WORKER_IMAGE
      # is set EXPLICITLY (no suffix derivation); AGENT_IMAGE now matches the built control-plane tag.
      - AGENT_IMAGE=${AGENT_IMAGE:-vexaai/v012-agent-api:${IMAGE_TAG:-dev}}
      - AGENT_WORKER_IMAGE=${AGENT_WORKER_IMAGE:-vexaai/v012-agent-worker:${IMAGE_TAG:-dev}}
      # THE MODEL EVERY SPAWNED WORKER RUNS (decision 36, founder: "let's move to sonnet"). Unset =
      # the CLI's own default, which on 2.1.197 is `claude-opus-4-8[1m]` — measured, not assumed.
      # Set it here and the runtime forwards it into each spawned worker (docker_backend's forward
      # list); ROLLBACK is to unset it and recreate the runtime.
      - VEXA_AGENT_MODEL=${VEXA_AGENT_MODEL:-}
      # Optional low-latency tuning for the Google Meet speaker-stream pipeline. Empty values keep
      # the bot defaults; runtime forwards configured values to spawned bot containers.
      - BOT_ALONE_SILENCE_WINDOW_MS=${BOT_ALONE_SILENCE_WINDOW_MS:-}
      - BOT_SPEAKER_MIN_AUDIO_SEC=${BOT_SPEAKER_MIN_AUDIO_SEC:-}
      - BOT_SPEAKER_SUBMIT_INTERVAL_SEC=${BOT_SPEAKER_SUBMIT_INTERVAL_SEC:-}
      - BOT_SPEAKER_CONFIRM_THRESHOLD=${BOT_SPEAKER_CONFIRM_THRESHOLD:-}
      - BOT_SPEAKER_MAX_BUFFER_SEC=${BOT_SPEAKER_MAX_BUFFER_SEC:-}
      - BOT_SPEAKER_IDLE_TIMEOUT_SEC=${BOT_SPEAKER_IDLE_TIMEOUT_SEC:-}
      - VEXA_AGENT_SRC_MOUNT=${VEXA_AGENT_SRC_MOUNT:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      # The Runtime brokers model credentials into spawned agents. Subscription credentials may be
      # mounted from the host; API-style Anthropic/OpenRouter env is forwarded from this trusted service.
      - HOST_CLAUDE_CREDENTIALS=${HOST_CLAUDE_CREDENTIALS:-}
      # The DIRECTORY holding it (~/.claude). Same credential, inode-stable delivery — see the
      # volumes: block below and .env.example. The docker backend derives the worker's credential
      # bind from this when HOST_CLAUDE_CREDENTIALS is unset.
      - HOST_CLAUDE_DIR=${HOST_CLAUDE_DIR:-}
      - HOST_CODEX_CREDENTIALS=${HOST_CODEX_CREDENTIALS:-}
      - VEXA_MIDTURN_INJECT=${VEXA_MIDTURN_INJECT:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CODEX_API_KEY=${CODEX_API_KEY:-}
      # Subscription OAuth as ENV (the twin of the credentials-file mount): `claude setup-token`
      # output. Dispatch forwards it to workers via MODEL_AUTH_ENV_ALLOWLIST when set.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # ANTHROPIC_AUTH_TOKEN + ANTHROPIC_BASE_URL now come from env_file (above), NOT environment: — an
      # `environment:` ${VAR} entry interpolates the AMBIENT SHELL first and silently shadowed .env (prod 401).
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - ANTHROPIC_DEFAULT_OPUS_MODEL=${ANTHROPIC_DEFAULT_OPUS_MODEL:-}
      - ANTHROPIC_DEFAULT_SONNET_MODEL=${ANTHROPIC_DEFAULT_SONNET_MODEL:-}
      - ANTHROPIC_DEFAULT_HAIKU_MODEL=${ANTHROPIC_DEFAULT_HAIKU_MODEL:-}
      # The runtime caller credential: every route but /health requires it, and agent-api and
      # meeting-api present it. No default — the runtime refuses to boot without one (mint-dev-env.sh
      # mints it into .env). No spawned workload receives it.
      - RUNTIME_API_TOKEN=${RUNTIME_API_TOKEN:-}
      # The workspace store as the RUNTIME serves it: what backs it (the named volume agent-api also
      # mounts) and where it sits inside a worker. A workload spec cannot move either; every mount a
      # spec declares must sit under the target. The target must equal agent-api's
      # VEXA_WORKSPACES_DIR and its mount of agent-workspaces (deploy/compose/tests hold them equal).
      # The only out-of-store source a spec may name is agent-api's _global tier, when an operator
      # keeps it outside the store (RUNTIME_EXTRA_MOUNT_SOURCES).
      - VEXA_WORKSPACE_MOUNT_SOURCE=${COMPOSE_PROJECT_NAME:-vexa-v012}_agent-workspaces
      - VEXA_WORKSPACE_MOUNT_TARGET=/workspaces
      - RUNTIME_EXTRA_MOUNT_SOURCES=${VEXA_GLOBAL_SYSTEM_WORKSPACE_PATH:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Spawned workloads never join the control-plane network. A meeting bot joins `bots`
      # (meeting-api for its callbacks and uploads, redis, storage); an agent worker joins `workers`
      # (the gateway's /mcp, redis, flows-api, and the opt-in llm-shim / searxng). Neither reaches
      # the runtime, postgres, admin-api, agent-api or the terminal. Each must equal the
      # project-prefixed network name (DockerBackend → HostConfig.NetworkMode).
      - DOCKER_NETWORK=${COMPOSE_PROJECT_NAME:-vexa-v012}_bots
      - DOCKER_WORKER_NETWORK=${COMPOSE_PROJECT_NAME:-vexa-v012}_workers
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # THE CREDENTIAL MIRROR, TWO SHAPES. The probe reads the DIRECTORY one first (config.v1
      # `model_inference` fallback_paths) and only falls back to the file.
      #
      #   ~/.claude          → /var/lib/vexa/host-claude:ro              ← use this one
      #   ~/.claude/.credentials.json → /var/lib/vexa/host-claude-credentials:ro   ← legacy
      #
      # WHY THE DIRECTORY: a single-FILE bind is resolved once, at container create, and pinned to
      # that INODE. The claude CLI refreshes an expiring OAuth token by writing a temp file and
      # rename(2)-ing it over .credentials.json — a new inode — so a LONG-LIVED container keeps
      # reading the pre-refresh token until it is recreated. That is 32h of dead agents on the
      # dogfood stack (2026-08-31 → 09-01): `claude` worked fine on the host the whole time.
      # A directory bind tracks the directory and resolves the filename live, so the refresh is
      # visible immediately. Spawned workers were never affected (a fresh bind per container).
      #
      # The file mount is KEPT so deployments that only set HOST_CLAUDE_CREDENTIALS keep working;
      # it is simply second in line. /dev/null when unset — the probe skips then (an ANTHROPIC_*
      # key may be the credential path instead), and a MISSING host path would otherwise arrive as
      # an empty DIRECTORY, which is the 'Model inference failed: Not logged in' signature the
      # probe exists to catch.
      - ${HOST_CLAUDE_DIR:-/dev/null}:/var/lib/vexa/host-claude:ro
      - ${HOST_CLAUDE_CREDENTIALS:-/dev/null}:/var/lib/vexa/host-claude-credentials:ro
      - ${HOST_CODEX_CREDENTIALS:-/dev/null}:/var/lib/vexa/host-codex-credentials:ro
      # The _global org tier: bound at the SAME path inside this container so the control plane's
      # exists()-check and the worker's host-side bind agree on one path string.
      - ${VEXA_GLOBAL_SYSTEM_WORKSPACE_PATH:-/dev/null}:${VEXA_GLOBAL_SYSTEM_WORKSPACE_PATH:-/var/lib/vexa/no-global}:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    depends_on:
      redis:
        condition: service_healthy
    networks: [vexa]
    restart: unless-stopped

  # Build-only: the per-dispatch WORKER image the runtime spawns (claude-in-container; NOT a long-running
  # service). Built via `docker compose build agent-worker`; the runtime references it by AGENT_WORKER_IMAGE.
  # `profiles` keeps it out of `up`; `command: true` makes an accidental start a no-op.
  agent-worker:
    build:
      context: ../..
      dockerfile: core/agent/worker/Dockerfile
    image: vexaai/v012-agent-worker:${IMAGE_TAG:-dev}
    profiles: ["build-only"]
    command: ["true"]

  agent-api:
    # The unit control plane — POST /invocations (dispatch → runtime.v1 agent spawn), /api/chat (SSE),
    # /api/sessions, /health. Wider build context (the carve root) to vendor the sealed schemas it
    # validates by path. The unit WORKER is a separate runtime.v1 `agent` workload (claude-in-container).
    build:
      context: ../..
      dockerfile: core/agent/services/agent-api/Dockerfile
    image: vexaai/v012-agent-api:${IMAGE_TAG:-dev}
    ports:
      - "127.0.0.1:${AGENT_API_PORT:-18100}:8100"
    # Provider auth (ANTHROPIC_AUTH_TOKEN + ANTHROPIC_BASE_URL) is sourced from .env via env_file so it is
    # a SINGLE SOURCE OF TRUTH that the ambient shell cannot shadow. env_file values are NOT interpolated
    # through the host shell (unlike `environment:` ${VAR} entries), which is exactly the prod-401 fix.
    env_file:
      # required:false — a fresh checkout (CI, gate worktree) has no .env; the proof stack
      # must boot without LLM auth. On a real deploy the file exists and wins as before.
      - path: .env
        required: false
    environment:
      - VEXA_AGENT_API_PORT=8100
      - VEXA_RUNTIME_API_URL=http://runtime:8090
      # P0 SSE ownership: agent-api verifies meeting-row ownership before opening /api/meeting/stream (owner-scoped like /ws).
      - VEXA_MEETING_API_URL=http://meeting-api:8080
      # How the runtime's scheduler reaches this service's /invocations sink when a routine fires (MVP2).
      - VEXA_AGENT_API_SELF_URL=http://agent-api:8100
      - VEXA_AGENT_PROFILE=agent
      # What GET /api/version reports, and what the terminal's reload bar compares against. It is a
      # property of the CONTAINER, not of the source tree — an image knows nothing about the repo it
      # was built from — so the deployment stamps it. Defaults to the image tag, which is right for a
      # plain `up -d`; the blue/green deploy sets it explicitly to the tag it is rolling out.
      # Unset reads as "unknown" and the bar simply never fires (PRD decision 39).
      - VEXA_BUILD_SHA=${VEXA_BUILD_SHA:-${IMAGE_TAG:-dev}}
      - VEXA_WORKSPACES_DIR=/workspaces
      # THE CREDENTIAL STORE'S KEY, and the profile that decides whether it may be absent (R-E08).
      # `secret_store` seals saved PATs and per-workspace deploy-key private halves. With no key it
      # GENERATES one under `<workspaces>/.secrets/`, beside the ciphertext it seals — which defends
      # a stray read and not a stolen volume or a backup, and the module has always said so. It was
      # settable nowhere, so no deployment ever set it and every deployment quietly took the weaker
      # property. Mint one (`openssl rand -hex 32`) to hold the key outside the data volume.
      #
      # VEXA_ENV is the same profile word the mcp and transcription services already read: unset or
      # anything but `production` keeps the generated key (with a warning on every boot that needs
      # it); `production` makes an unset VEXA_SECRETS_KEY a refusal naming the fix.
      - VEXA_SECRETS_KEY=${VEXA_SECRETS_KEY:-}
      - VEXA_ENV=${VEXA_ENV:-development}
      # Lane M: the users.data.memberships[] index mirror over the admin-api internal edge
      # (policy/members.json in the workspace git repo stays authoritative; this is the listing cache).
      - VEXA_ADMIN_API_URL=http://admin-api:8001
      # NO PLACEHOLDER FALLBACK. F95 removed the published `vexa-internal-secret` default from
      # every service that REFUSES it at boot; this line kept it, so an unconfigured stack still
      # PRESENTED the published literal as internal-tier authority. Unset is unset (A19). The KEY
      # NAME is the canonical one: `core/agent/control_plane/config.v1.json` declares
      # `INTERNAL_API_SECRET` and marks `VEXA_INTERNAL_API_SECRET` DEPRECATED ("no deploy surface
      # sets it on agent-api any more"), so the A19 fix rides the spelling this service reads.
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      # The runtime caller credential agent-api presents on every runtime.v1 / schedule.v1 call.
      # Required; the same value the runtime and meeting-api hold.
      - RUNTIME_API_TOKEN=${RUNTIME_API_TOKEN:-}
      # gateway-identity.v1: the gateway's PUBLIC key, which verifies its X-Vexa-Identity. agent-api
      # believes an x-user-* header only with that signature (or from the internal tier above), can
      # check it and cannot make one, and forwards it unchanged to the credential broker. Written by
      # the `identity-keys` one-shot; this service mounts the public half only.
      - VEXA_GATEWAY_IDENTITY_PUBLIC_KEY_FILE=/run/vexa-identity/public/key.pem
      # The post-meeting room resolves a participant's email to a subject through admin-api. There
      # is no narrow door yet — the internal-secret tier exposes no by-email lookup, and
      # GET /admin/users/email/{email} sits behind this much broader credential, which can also
      # create and patch users. So it is DELIBERATELY EMPTY BY DEFAULT: unset, the room resolves no
      # participant and mounts zero desks, which is the safe degradation. It never falls back to
      # matching a person by name. Delete this once admin-api serves
      # GET /internal/users/by-email/{email} returning only {id} — agent-api already prefers it.
      - VEXA_ADMIN_API_TOKEN=${ADMIN_TOKEN:-}
      # Read-only DSN for the meetings database, for ONE question: which meetings is this address
      # invited to (data.attendees). Only the invite record knows somebody was invited before they
      # ever signed in, which is the case a first visit is. Unset, the first-visit opening simply
      # says nothing about meetings — it never asserts there are none. Goes away when meeting-api
      # serves an invited-by-address route and agent-api stops holding a second DB credential.
      - VEXA_MEETINGS_DB_URL=${MEETINGS_DB_URL:-}
      - VEXA_AGENT_MODEL=${VEXA_AGENT_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # ANTHROPIC_AUTH_TOKEN + ANTHROPIC_BASE_URL come from env_file (below), NOT environment: — an
      # `environment:` entry interpolates the AMBIENT SHELL first, so a host `export ANTHROPIC_BASE_URL`
      # silently shadowed deploy/compose/.env and a prod 401 followed (OpenRouter token → api.anthropic.com).
      # env_file reads the value literally from .env; the shell can no longer override it (single source of truth).
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - ANTHROPIC_DEFAULT_OPUS_MODEL=${ANTHROPIC_DEFAULT_OPUS_MODEL:-}
      - ANTHROPIC_DEFAULT_SONNET_MODEL=${ANTHROPIC_DEFAULT_SONNET_MODEL:-}
      - ANTHROPIC_DEFAULT_HAIKU_MODEL=${ANTHROPIC_DEFAULT_HAIKU_MODEL:-}
      - VEXA_LOG_LEVEL=${LOG_LEVEL:-info}
      # Stream primitive — the per-dispatch redis Streams the control plane relays (unit:<id>:out → SSE).
      - VEXA_REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      # The backing the Runtime binds into the worker as the workspace store (the project-prefixed volume).
      - VEXA_WORKSPACE_MOUNT_SOURCE=${COMPOSE_PROJECT_NAME:-vexa-v012}_agent-workspaces
      # Three-tier mount stack (AMENDMENT 4): the platform-owned GLOBAL SYSTEM workspace (_global) mounted
      # into every worker (behaviour/skills/tools). OPTIONAL: empty = the in-store /workspaces/_global,
      # created empty at boot; set it only to manage `_global` as a separate host repo OUTSIDE the
      # store. REF pins it to a branch/tag/sha for safe rollout, empty = HEAD.
      - VEXA_GLOBAL_SYSTEM_WORKSPACE_PATH=${VEXA_GLOBAL_SYSTEM_WORKSPACE_PATH:-}
      - VEXA_GLOBAL_SYSTEM_WORKSPACE_REF=${VEXA_GLOBAL_SYSTEM_WORKSPACE_REF:-}
      - VEXA_GLOBAL_ADMIN_SUBJECTS=${VEXA_GLOBAL_ADMIN_SUBJECTS:-}
      # The shared key the control plane signs per-dispatch tokens with (dev tier; k8s → SPIRE).
      - VEXA_DISPATCH_SIGNING_KEY=${VEXA_DISPATCH_SIGNING_KEY:-dev-dispatch-signing-key}
      # THE WORKER'S TOOLBELT (capability worker_toolbelt). agent-api mints a short-lived, scoped
      # delegation token per dispatch with this secret; the worker presents it at the gateway's /mcp,
      # where the ONE assembled MCP server serves the meetings, agent and flows tools (ADR-0037), and
      # identity verifies it with the same secret (admin-api above). A worker never holds a durable
      # user credential. mint-dev-env.sh generates the secret; with it empty no toolbelt is attached
      # and every spawn says so in the log.
      - VEXA_MCP_URL=${VEXA_MCP_URL:-http://gateway:8000/mcp}
      - VEXA_MCP_DELEGATION_SECRET=${VEXA_MCP_DELEGATION_SECRET:-}
      # THE SCAFFOLD's link origin (PRD §5.5). The SAME variable the flows lane reads, on purpose:
      # one deployment fact, one name. Unset, POST /internal/scaffolds refuses to mint rather than
      # handing a step a url with no origin — every deeplink the rig ever minted pointed at a port
      # nothing serves because this variable was set NOWHERE (PRD §3.3), and that failure is only
      # visible at the click unless the mint refuses.
      - VEXA_UI_URL=${VEXA_UI_URL:-}
      # 'Add bot from URL' (terminal): agent-api forwards POST /api/meeting/bot → the gateway POST /bots.
      - VEXA_GATEWAY_URL=http://gateway:8000
      - VEXA_BOT_API_KEY=${VEXA_BOT_API_KEY:-}
      # ── Connections (credential-broker.v1, ADR-0040) ──────────────────────────────────────
      # agent-api signs as the `agent` role: request, list and USE a person's connections, never
      # consent or store. The key is generated by `connections-keys` and mounted below; no worker
      # ever mounts it. Set VEXA_CONNECTIONS_BROKER_URL empty to run without Connections.
      - VEXA_CONNECTIONS_BROKER_URL=${VEXA_CONNECTIONS_BROKER_URL-http://credential-broker:8100}
      - VEXA_CONNECTIONS_AGENT_KEY_FILE=/run/vexa-connections/agent/key
      # Opt-in: Git tokens and deploy keys move from this service's own encrypted store into the
      # broker. Set VEXA_GIT_STORE_BROKER_URL=http://credential-broker:8100 to switch; the key
      # path follows it, so the pair is set together or not at all.
      - VEXA_GIT_STORE_BROKER_URL=${VEXA_GIT_STORE_BROKER_URL:-}
      - VEXA_GIT_STORE_KEY_FILE=${VEXA_GIT_STORE_BROKER_URL:+/run/vexa-connections/git/key}
      # ── the publish edge (config.v1 class `publish-edge`) ─────────────────────────────────
      # The agent domain hands `desk.unscaffolded` and `claim.proposed` to flows here — the two
      # desk cards. A PUBLISH IS NOT A DEPENDENCY: the calls are bounded at 2s and swallowed, and
      # this service provisions desks and records claims identically with the variable empty.
      #
      # DEFAULTS TO THE SERVICE, unlike admin-api's edge a few blocks up, and the difference is
      # deliberate — it is the `mcp` block's rule, not a second opinion: flows-api is a service in
      # THIS FILE, so an empty default would mean the full stack publishes nothing by default and
      # the queue would be empty on a plain `up -d` with every part of the mechanism green. Set it
      # empty to run a deployment that genuinely does not carry the flows domain.
      - VEXA_FLOWS_API_URL=${VEXA_FLOWS_API_URL:-http://flows-api:8200}
      # The same operator key flows-api itself reads, passed through and never re-defaulted to a
      # literal (F95). flows' POST /events is not open, so a target without its credential is a
      # target that always 401s — which looks exactly like a deployment running no flows, and is
      # not one. Empty here and empty on flows-api is a stack whose intake refuses everybody,
      # which is the fail-closed shape #1453 chose on purpose.
      - VEXA_FLOWS_API_KEY=${VEXA_FLOWS_API_KEY:-}
      # The credential is MOUNTED below, but the capability oracle reads this env to know a
      # subscription path is CONFIGURED at all. Without the pair, a correctly-mounted credential
      # reports "No model credentials are configured" and the turn is refused before dispatch
      # (found by dogfooding 2026-08-30).
      - HOST_CLAUDE_CREDENTIALS=${HOST_CLAUDE_CREDENTIALS:-}
      - HOST_CLAUDE_DIR=${HOST_CLAUDE_DIR:-}
    volumes:
      # The Workspace store backing (dev): the worker mounts the subject's subdir; agent-api reads the tree.
      - agent-workspaces:/workspaces
      # Settings → Models "Test" button: /api/models/test inspects the SAME subscription credential
      # the runtime brokers into workers (existence + expiry check — surfaces the stale-Keychain
      # 401 with its remedy instead of failing the next chat turn). Both shapes, DIRECTORY first —
      # see the runtime service above for why the single-file bind goes stale on a token refresh
      # (inode pinning) and why this surface then reports a live token as expired. /dev/null when
      # unset, same convention as the runtime's probe mount.
      - ${HOST_CLAUDE_DIR:-/dev/null}:/var/lib/vexa/host-claude:ro
      - ${HOST_CLAUDE_CREDENTIALS:-/dev/null}:/var/lib/vexa/host-claude-credentials:ro
      # _global org tier. UNSET (the default) it lives in the agent-workspaces volume at
      # /workspaces/_global, which agent-api creates EMPTY at boot — nothing to configure (founder
      # ruling 2026-10-08: `_global` may be empty). There is deliberately NO bind onto
      # /workspaces/_global: binding /dev/null there made docker leave an empty `_global` FILE in
      # the volume, which then blocked the directory. Only an operator-supplied OUT-OF-STORE path is
      # bound, at its own host path, where the control plane's exists() check runs.
      - ${VEXA_GLOBAL_SYSTEM_WORKSPACE_PATH:-/dev/null}:${VEXA_GLOBAL_SYSTEM_WORKSPACE_PATH:-/var/lib/vexa/no-global2}:ro
      # The agent and git role keys, and nothing else of the broker's (Connections).
      - connections-agent-key:/run/vexa-connections/agent:ro
      - connections-git-key:/run/vexa-connections/git:ro
      # gateway-identity.v1: the gateway's public key (never the signing key).
      - identity-public-key:/run/vexa-identity/public:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    depends_on:
      runtime:
        condition: service_healthy
      connections-keys:
        condition: service_completed_successfully
      identity-keys:
        condition: service_completed_successfully
    # `connections` reaches the credential broker; spawned workers join `vexa` only and cannot.
    networks: [vexa, connections]
    restart: unless-stopped

  meeting-api:
    build:
      # Wider context (the v0.12 carve root) than the other services: meeting_api validates at the
      # seam and loads the sealed invocation/lifecycle/webhook/runtime/schedule schemas BY PATH, so
      # those frozen contract files are vendored into the image (see the Dockerfile).
      context: ../..
      dockerfile: core/meetings/services/meeting-api/Dockerfile
    image: vexaai/v012-meeting-api:${IMAGE_TAG:-dev}
    ports:
      - "127.0.0.1:${MEETING_API_PORT:-18080}:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-vexa}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - RUNTIME_API_URL=http://runtime:8090
      # The runtime caller credential meeting-api presents on every runtime.v1 call. Required; the
      # same value the runtime and agent-api hold. Never placed in a bot invocation.
      - RUNTIME_API_TOKEN=${RUNTIME_API_TOKEN:-}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      # gateway-identity.v1: the gateway's PUBLIC key — the owner, bot limit, memberships and webhook
      # meeting-api reads come from a signature it verifies (or the internal tier), never a bare
      # header. Written by `identity-keys`; mounted read-only below, public half only.
      - VEXA_GATEWAY_IDENTITY_PUBLIC_KEY_FILE=/run/vexa-identity/public/key.pem
      # The bot's display name in the meeting. The terminal omits bot_name on join, so this is what
      # participants see; set DEFAULT_BOT_NAME in .env and restart meeting-api (no terminal rebuild).
      - DEFAULT_BOT_NAME=${DEFAULT_BOT_NAME:-Vexa}
      # The background sweeps' internal lookups: auto-join fetches per-user spawn context
      # (/internal/users/{id}/bot-context) and calendar sync discovers connected ICS feeds
      # (/internal/calendar-configs). Unset -> calendar sync no-ops, auto-join spawns uncapped.
      - ADMIN_API_URL=http://admin-api:8001
      # MeetingToken is signed (mint) AND verified (recordings upload) with ADMIN_TOKEN — the SAME
      # admin secret admin-api holds (admin-api gets ADMIN_API_TOKEN=${ADMIN_TOKEN}). Exactly like
      # main (meeting-api ADMIN_TOKEN = admin-api ADMIN_API_TOKEN). __main__ passes token_secret=ADMIN_TOKEN.
      # NO `changeme` FALLBACK (A19) — same credential as admin-api's ADMIN_API_TOKEN above, and
      # meeting-api declares it required-explicit, so an unset value refuses the boot loudly
      # instead of signing every MeetingToken with a secret published in this repository.
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      # STT the spawned bot transcribes with — bot_spawn threads these into the invocation (registry
      # `stt` resource; a token that can actually transcribe — the boot probe + wizard Test verify
      # it with real audio). Unset → bot joins+captures but no transcript.
      # MODEL is the id validating backends require (Groq/vLLM); unset → whisper-1.
      - TRANSCRIPTION_SERVICE_URL=${TRANSCRIPTION_SERVICE_URL:-}
      - TRANSCRIPTION_SERVICE_TOKEN=${TRANSCRIPTION_SERVICE_TOKEN:-}
      - TRANSCRIPTION_MODEL=${TRANSCRIPTION_MODEL:-}
      # Deployment-level defaults for a spawn's transcribe/recording flags when the request does not
      # say (config.v1 `defaulted` keys). TRANSCRIBE_ENABLED=false makes a no-STT deployment spawn
      # capture-only bots instead of 503-ing every default POST /bots.
      - TRANSCRIBE_ENABLED=${TRANSCRIBE_ENABLED:-true}
      - RECORDING_ENABLED=${RECORDING_ENABLED:-true}
      # Authenticated-bot mode (deployment-scoped): when true, every spawned bot restores the
      # provisioned browser session (make login) from the userdata store and joins signed-in.
      # BOT_S3_* are SCOPED userdata credentials — never the deployment's admin S3 creds.
      # Docs: /authenticated-bots.
      - BOT_AUTHENTICATED=${BOT_AUTHENTICATED:-false}
      - BOT_USERDATA_S3_PATH=${BOT_USERDATA_S3_PATH:-}
      - BOT_S3_ENDPOINT=${BOT_S3_ENDPOINT:-}
      - BOT_S3_BUCKET=${BOT_S3_BUCKET:-}
      - BOT_S3_ACCESS_KEY=${BOT_S3_ACCESS_KEY:-}
      - BOT_S3_SECRET_KEY=${BOT_S3_SECRET_KEY:-}
      # Optional operator-owned service-authority.v1 boundary. Empty is explicit OSS allow-all.
      - VEXA_SERVICE_AUTHORITY_CONFIG=${VEXA_SERVICE_AUTHORITY_CONFIG:-}
      - VEXA_SERVICE_AUTHORITY_SECRET=${VEXA_SERVICE_AUTHORITY_SECRET:-}
      - VEXA_SYSTEM_WEBHOOK_URL=${VEXA_SYSTEM_WEBHOOK_URL:-}
      - VEXA_SYSTEM_WEBHOOK_SECRET=${VEXA_SYSTEM_WEBHOOK_SECRET:-}
      - VEXA_SYSTEM_WEBHOOK_ALLOW_PRIVATE_HTTP=${VEXA_SYSTEM_WEBHOOK_ALLOW_PRIVATE_HTTP:-false}
      - VEXA_SYSTEM_WEBHOOK_TIMEOUT_S=${VEXA_SYSTEM_WEBHOOK_TIMEOUT_S:-10}
      # F168/F181: meetings→flows publish edge (config.v1 publish-edge, meeting_api/events.py) —
      # meeting-api telling flows a bot it dispatched went active / completed, best-effort and
      # swallowed on failure, the same as admin-api's onboarding.completed edge just below it in
      # spirit (this file has no admin-api block above to point at, so: deploy/compose/
      # docker-compose.yml's admin-api service, VEXA_FLOWS_API_URL line). Empty here is the no-flows
      # profile — a deployment with no flows domain still runs meetings exactly as one with a
      # flows domain does, and the fact stays out of `whats_waiting` rather than the boot refusing.
      - VEXA_FLOWS_API_URL=${VEXA_FLOWS_API_URL:-}
      - VEXA_FLOWS_API_KEY=${VEXA_FLOWS_API_KEY:-}
      # Self-hosted Jitsi hostnames (comma-separated) recognized in pasted + calendar links.
      - VEXA_JITSI_HOSTS=${VEXA_JITSI_HOSTS:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-storage:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-vexa-access-key}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-vexa-secret-key}
      - MINIO_BUCKET=${MINIO_BUCKET:-vexa}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - identity-public-key:/run/vexa-identity/public:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      runtime:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      identity-keys:
        condition: service_completed_successfully
    networks: [vexa, bots]   # bots post their lifecycle callbacks and uploads here
    restart: unless-stopped

  gateway:
    build:
      # THE REPO ROOT, like meeting-api and agent-api. The edge reads each domain's
      # routes.v1.json BY PATH at import (routes_manifest.py), so the image must carry the
      # manifests of the domains it fronts; a context scoped to the service cannot reach them.
      context: ../..
      dockerfile: core/gateway/services/gateway/Dockerfile
    image: vexaai/v012-gateway:${IMAGE_TAG:-dev}
    ports:
      - "127.0.0.1:${API_GATEWAY_HOST_PORT:-18056}:8000"
    environment:
      - ADMIN_API_URL=http://admin-api:8001
      - MEETING_API_URL=http://meeting-api:8080
      # The MCP streamable-HTTP front door (#795): the gateway proxies /mcp here — GET (the SSE
      # stream) relayed on the streaming client, every other method on the buffered forward.
      # NOT a depends_on: mcp itself depends on the gateway (GATEWAY_URL), and compose refuses a
      # dependency cycle. The forward simply 502s until mcp is up, like any other upstream.
      - MCP_URL=http://mcp:8010
      # THE AGENT DOMAIN'S PRESENCE SIGNAL (PRD 40.6 / 40.7). This full profile runs agents, so it
      # names the door and the edge fronts `/agent/*`. The `no-agents` profile sets it EMPTY —
      # the gateway then registers no /agent route and assembles no agent rows into its scope
      # table, so a request there is 404 rather than a 401 about a route this stack does not have.
      # It was a CODE default before, which made a deployment unable to say it has no agents.
      #
      # THE COMPOSE DEFAULT IS THE SERVICE, and moving it from a code default to here is the whole
      # of decision 40.7 — but the move shipped with `:-` and NO default, so `agent-api` kept
      # running in the default profile while every `/agent/*` route silently 404'd for every
      # self-hoster: seven routes that worked at v0.12.26, gone, with nothing anywhere to read.
      # `.env.example` never set it either. An OPT-OUT (set it empty) is a deployment saying it has
      # no agents; a MISSING default was nobody saying anything and the product answering "no".
      - AGENT_API_URL=${AGENT_API_URL:-http://agent-api:8100}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      # gateway-identity.v1: the Ed25519 PRIVATE key the gateway signs the identity it resolved with,
      # onto every forward. This is the only service that mounts it; agent-api, meeting-api and the
      # credential broker get the public half and can verify but never sign. Written once by the
      # `identity-keys` one-shot below.
      - VEXA_GATEWAY_IDENTITY_SIGNING_KEY_FILE=/run/vexa-identity/signing/key.pem
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # fastapi-guard edge layer (edge_guard.py): per-IP throttle + auto-ban at the edge.
      # ON by default with generous limits (owner ruling — protection that ships dark protects
      # nobody). Opt out with GUARD_ENABLED=false in .env; all keys interpolate from .env.
      # GUARD_WS_ENABLED is the optional /ws hook (off, opt-in): in-memory per-process — does
      # NOT share ban/rate-limit state with the Redis-backed HTTP layer, and under uvicorn
      # --workers N>1 each worker keeps an independent WS ban set.
      - GUARD_ENABLED=${GUARD_ENABLED:-true}
      - GUARD_WS_ENABLED=${GUARD_WS_ENABLED:-false}
      - GUARD_ENABLE_REDIS=${GUARD_ENABLE_REDIS:-true}
      - GUARD_RATE_LIMIT_RPM=${GUARD_RATE_LIMIT_RPM:-600}
      - GUARD_RATE_LIMIT_WINDOW=${GUARD_RATE_LIMIT_WINDOW:-60}
      - GUARD_AUTO_BAN_THRESHOLD=${GUARD_AUTO_BAN_THRESHOLD:-10}
      - GUARD_AUTO_BAN_DURATION=${GUARD_AUTO_BAN_DURATION:-3600}
      - GUARD_IP_WHITELIST=${GUARD_IP_WHITELIST:-}
      - GUARD_IP_BLACKLIST=${GUARD_IP_BLACKLIST:-}
      - GUARD_TRUSTED_PROXIES=${GUARD_TRUSTED_PROXIES:-}
      - GUARD_TRUST_X_FORWARDED_PROTO=${GUARD_TRUST_X_FORWARDED_PROTO:-false}
      - GUARD_BLOCKED_COUNTRIES=${GUARD_BLOCKED_COUNTRIES:-}
      - GUARD_BLOCK_CLOUD_PROVIDERS=${GUARD_BLOCK_CLOUD_PROVIDERS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      # gateway-identity.v1: the signing key, mounted here and nowhere else.
      - identity-signing-key:/run/vexa-identity/signing:ro
    init: true
    depends_on:
      admin-api:
        condition: service_healthy
      meeting-api:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity-keys:
        condition: service_completed_successfully
    networks: [vexa, workers]   # workers reach their toolbelt at /mcp here
    restart: unless-stopped

  # ─── gateway-identity.v1: the gateway's signing keypair ─────────────────────────────────────────
  # One-shot: generates an Ed25519 keypair the first time the stack starts and leaves it alone
  # afterwards — an existing signing key is kept and its public half rewritten from it, so a lost
  # public volume heals. The PRIVATE key goes to `identity-signing-key`, which only the gateway
  # mounts; the PUBLIC key to `identity-public-key`, which agent-api, meeting-api and the credential
  # broker mount read-only. No other service mounts either. Same image as the gateway: the
  # generator is the gateway's own vendored gateway-identity.v1 module. To rotate, remove
  # `identity-signing-key` and restart the stack (the four services then reload the new pair).
  identity-keys:
    build:
      context: ../..
      dockerfile: core/gateway/services/gateway/Dockerfile
    image: vexaai/v012-gateway:${IMAGE_TAG:-dev}
    user: "0:0"
    command: ["python", "/app/src/gateway/identity_token.py", "keygen",
              "/keys/signing/key.pem", "/keys/public/key.pem"]
    volumes:
      - identity-signing-key:/keys/signing
      - identity-public-key:/keys/public
    network_mode: none
    restart: "no"

  # flows-api — the reaction engine's HTTP surface, and one of the domains the MCP assembly asks
  # for a tool manifest (PRD decision 40).
  #
  # WHAT THIS REPLACES. The flows lanes run on the dogfood rig as HOST processes out of
  # `flows-up.sh`, on loopback :18200/:18201, and the compose-network `mcp` service was pointed at
  # the docker BRIDGE ADDRESS of that host lane so it could fetch /.well-known/mcp-tools.json — a
  # host-specific IP written into a deployment, for a service the deployment did not run. This is
  # the service. The host lane keeps working unchanged until the estate cuts over: the bind address
  # defaults to loopback in code and is widened HERE, in the container's own environment, so the
  # exposure is visible next to the port that publishes it.
  #
  # ONE IMAGE, THREE ENTRYPOINTS, ONE CONFIGURATION. `flows-api`, `flows-mailbox` and
  # `flows-worker` (below) differ by `command` and by nothing else, so they carry the SAME
  # environment: the config.v1 declaration belongs to the flows domain, not to one of its
  # processes, and a lane configured differently from its siblings is how a mail policy comes to
  # hold in one place and not the other. The WORKER is the image's default command; it used not
  # to be started here (F190 — a deployment that admits facts through `flows-api` but never runs
  # the process that advances them), and now is, right after `flows-mailbox` below.
  flows-api:
    build:
      # The repo ROOT: the image COPYs core/flows/src AND the behavior showcase at behavior/.
      context: ../..
      dockerfile: core/flows/Dockerfile
    image: vexaai/v012-flows:${IMAGE_TAG:-dev}
    command: ["python", "-m", "flows_integrations.flows_api"]
    ports:
      # Loopback-published for debugging, like every other service here; overridable so two stacks
      # can share a host.
      - "127.0.0.1:${FLOWS_API_HOST_PORT:-18200}:8200"
    environment:
      # ── the listener ────────────────────────────────────────────────────────────────────────
      # In a container, loopback is THIS container's loopback — nothing else on the network can
      # reach it. That is the whole reason the bridge-address hack existed. Said out loud here
      # rather than flipped as a code default, which would have published the rig's host lane on
      # every interface of that box the day it merged.
      - VEXA_FLOWS_API_HOST=0.0.0.0
      - VEXA_FLOWS_API_PORT=${VEXA_FLOWS_API_PORT:-8200}
      - VEXA_FLOWS_DB_URL=postgresql+psycopg://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-vexa}
      # ── the credentials, all fail-closed (#1453, F95) ───────────────────────────────────────
      # NO DEFAULT AND NO `:?`. No default because a weak one makes an unconfigured deployment look
      # configured — that is F95's whole lesson, and `flows_steps/common.py` refuses the published
      # placeholder literals by name. No `:?` either, though it is tempting: compose evaluates it
      # while PARSING THE FILE, so it fails `docker compose config` for the entire stack, including
      # deployments that do not run flows at all. The refusal belongs to the process that needs the
      # secret, where it names itself and stops only itself — and it is already there, and tested.
      - VEXA_FLOWS_API_KEY=${VEXA_FLOWS_API_KEY:-}
      # admin-api's OWN token, under the name flows reads it by. One credential, two spellings, is
      # what F95 was; this is the second spelling of ADMIN_TOKEN and it is passed through, never
      # re-defaulted to a literal of its own.
      - VEXA_FLOWS_ADMIN_KEY=${VEXA_FLOWS_ADMIN_KEY:-${ADMIN_TOKEN:-}}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      - VEXA_FLOWS_TIMELINE_KEY=${VEXA_FLOWS_TIMELINE_KEY:-}
      # ── the doors (#1453 made these required-explicit) ──────────────────────────────────────
      # Service names on the compose network. An unnamed door is a loud refusal at the moment it
      # would have been used, so naming them here is what makes the refusal never fire in a stack
      # that does run these domains.
      - VEXA_FLOWS_ADMIN_API_URL=http://admin-api:8001
      - VEXA_FLOWS_GATEWAY_URL=http://gateway:8000
      # OPTIONAL DOMAIN, and the reason it is a variable rather than a service name: decision 40
      # says a deployment may not run the agent domain at all. Unset, steps that need it answer
      # `not_present` instead of reaching for a door that is not there (#1453).
      - VEXA_FLOWS_AGENT_API_URL=${VEXA_FLOWS_AGENT_API_URL:-}
      # THE LINK PORT, not a door (PRD decision 4: flows owns a link port, the terminal is one
      # adapter, the no-agents product has none). Unset, nothing is mailed with a link and any step
      # that would compose one refuses naming this key — it no longer decides whether flows BOOTS.
      - VEXA_UI_URL=${VEXA_UI_URL:-}
      # ── the mailbox (read by the flows-mailbox lane below; one image, one declaration) ───────
      - VEXA_MAIL_INBOX=${VEXA_MAIL_INBOX:-imap}
      - VEXA_MAIL_ADDR=${VEXA_MAIL_ADDR:-}
      - VEXA_MAIL_APP_PASSWORD=${VEXA_MAIL_APP_PASSWORD:-}
      - VEXA_MAIL_SMTP_HOST=${VEXA_MAIL_SMTP_HOST:-}
      - VEXA_MAIL_SMTP_PORT=${VEXA_MAIL_SMTP_PORT:-25}
      - VEXA_MAIL_SMTP_SECURE=${VEXA_MAIL_SMTP_SECURE:-}
      - VEXA_MAIL_SMTP_TLS_INSECURE=${VEXA_MAIL_SMTP_TLS_INSECURE:-}
      - VEXA_MAIL_SMTP_USER=${VEXA_MAIL_SMTP_USER:-}
      - VEXA_MAIL_SMTP_PASSWORD=${VEXA_MAIL_SMTP_PASSWORD:-}
      - VEXA_MAILPIT_URL=${VEXA_MAILPIT_URL:-}
      - VEXA_MAILPIT_LOOKBACK_S=${VEXA_MAILPIT_LOOKBACK_S:-300}
      - VEXA_NOTIFY_CHANNEL=${VEXA_NOTIFY_CHANNEL:-smtp}
      # ── Microsoft 365 over Graph (VEXA_MAIL_INBOX=graph / VEXA_NOTIFY_CHANNEL=graph) ────────
      # All four together or none — the `mailbox_graph` capability is mode=all, so three of four
      # reads as `misconfigured` on /health rather than as a mailbox that half works. Empty is
      # the ordinary state: this deployment is not on Microsoft.
      - VEXA_GRAPH_TENANT_ID=${VEXA_GRAPH_TENANT_ID:-}
      - VEXA_GRAPH_CLIENT_ID=${VEXA_GRAPH_CLIENT_ID:-}
      - VEXA_GRAPH_CLIENT_SECRET=${VEXA_GRAPH_CLIENT_SECRET:-}
      - VEXA_GRAPH_MAILBOX=${VEXA_GRAPH_MAILBOX:-}
      # ── who the mailbox will act for (R-B12) ────────────────────────────────────────────────
      # UNSET IS NOT `EVERYONE`: unset means the mailbox's own domain. Empty here is therefore the
      # safe value and not a hole.
      - VEXA_FLOWS_MAIL_DOMAINS=${VEXA_FLOWS_MAIL_DOMAINS:-}
      - VEXA_FLOWS_MAIL_QUARANTINE_REPLY=${VEXA_FLOWS_MAIL_QUARANTINE_REPLY:-}
      - VEXA_FLOWS_MAIL_RATE_PER_SENDER=${VEXA_FLOWS_MAIL_RATE_PER_SENDER:-12}
      - VEXA_FLOWS_MAIL_RATE_GLOBAL=${VEXA_FLOWS_MAIL_RATE_GLOBAL:-120}
      - VEXA_FLOWS_MAIL_RATE_WINDOW_S=${VEXA_FLOWS_MAIL_RATE_WINDOW_S:-3600}
      - VEXA_FLOWS_MAIL_BODY_MAX=${VEXA_FLOWS_MAIL_BODY_MAX:-4000}
      # ── behaviour and content ───────────────────────────────────────────────────────────────
      - VEXA_FLOWS_ATTENDEE_DOMAINS=${VEXA_FLOWS_ATTENDEE_DOMAINS:-}
      - VEXA_FLOWS_DATA_STATEMENT=${VEXA_FLOWS_DATA_STATEMENT:-}
      # The private behavior tree a deployment mounts (decision 12). EMPTY IS THE OSS PRODUCT: the
      # showcase baked into the image at /behavior is what flows reads.
      - VEXA_BEHAVIOR_DIR=${VEXA_BEHAVIOR_DIR:-}
      - VEXA_JITSI_HOSTS=${VEXA_JITSI_HOSTS:-}
      - VEXA_FLOWS_USER_KEY_TTL_S=${VEXA_FLOWS_USER_KEY_TTL_S:-900}
      - VEXA_TIMELINE_SCAN_ROWS=${VEXA_TIMELINE_SCAN_ROWS:-2000}
