# Keycloak SSO overlay — optional identity provider for terminal sign-in.
#
# Vexa's declared identity direction (docs/docs/architecture/identity-and-trust.mdx: SPIRE +
# Keycloak + RFC 8693). This overlay is ADDITIVE and self-contained: without it the terminal's
# existing sign-in paths are untouched, and the terminal's Keycloak provider self-gates on the
# KEYCLOAK_* env below (absent creds -> no button, exactly like Google/Microsoft).
#
#   docker compose -p vexa-v012 -f docker-compose.yml -f docker-compose.keycloak.yml up -d
#
# Keycloak runs on its OWN postgres, not the stack's: the identity store is blast-radius isolated
# from meeting data, and adding/removing this overlay never migrates or touches the vexa database.
#
# PRODUCTION: see keycloak/README.md — rotate the client secret, set KC_HOSTNAME to your public
# https origin, put exact callback URLs in the realm, and swap `start-dev` for `start`.
services:
  keycloak-db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak}
      - TZ=UTC
      - PGTZ=UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks: [vexa]
    restart: unless-stopped

  # Local mail CATCHER, not a mail sender: Keycloak posts verification / password-reset mail here
  # and it is trapped in a web inbox instead of reaching a real address. That makes the signup
  # flow fully exercisable offline. PRODUCTION: delete this service and point the realm's
  # smtpServer at your real relay (see keycloak/README.md).
  mailpit:
    image: axllent/mailpit:latest
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-18025}:8025"
    networks: [vexa]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USER:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak}
      # Pin the issuer to the browser-facing origin so every token carries one stable `iss`,
      # whichever hostname a backchannel call arrives on. Mismatched issuers are the classic
      # "token rejected as inactive" failure when browser and server reach Keycloak differently.
      - KC_HOSTNAME=${KEYCLOAK_PUBLIC_URL:-http://localhost:18101}
      - KC_HEALTH_ENABLED=true
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-18101}:8080"
    volumes:
      # Two DIRECTORY mounts, deliberately: import/ holds only realm JSON so Keycloak's importer
      # never meets the theme tree. Bind-mounting a single file here instead is a trap — Docker
      # pre-creates a directory at a missing destination, and the next start then fails with
      # "not a directory" until the stale entry is cleared by hand.
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks: [vexa]
    restart: unless-stopped

  terminal:
    environment:
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-vexa-terminal}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-dev-terminal-secret}
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER:-http://localhost:18101/realms/vexa}
      - KEYCLOAK_REQUIRE_VERIFIED_EMAIL=${KEYCLOAK_REQUIRE_VERIFIED_EMAIL:-true}
      # NextAuth needs an absolute origin to build the callback URL; the base .env ships this
      # EMPTY, and an empty value makes NextAuth throw ERR_INVALID_URL — which 500s
      # /api/auth/providers and silently hides EVERY sign-in button (Google/Microsoft too, not
      # just Keycloak). Default it here so enabling this overlay is never a silent no-op.
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:13000}

volumes:
  keycloak-db-data:
