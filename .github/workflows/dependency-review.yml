# Dependency review: a pull request may not add a runtime dependency with a HIGH or CRITICAL advisory,
# or under a licence outside FINOS Categories A and B. LGPL is not on the list: FINOS lists it as
# Category X. The repository's own reviewed exceptions (license-exceptions.json) are enforced by
# gate:licenses; this check reads GitHub's dependency graph for the diff of the pull request only.
name: Dependency review

on:
  pull_request:                       # every base: main and the 0.13 line

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      # No checkout: the action reads the dependency graph diff through the API.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          comment-summary-in-pr: never
          # FINOS Category A (and common SPDX spellings) and Category B (MPL, EPL, CDDL, OFL).
          allow-licenses: >-
            0BSD,
            Apache-2.0,
            BlueOak-1.0.0,
            BSD-2-Clause,
            BSD-3-Clause,
            BSD-3-Clause-Clear,
            CC0-1.0,
            CC-BY-4.0,
            CDDL-1.0,
            CDDL-1.1,
            EPL-1.0,
            EPL-2.0,
            ISC,
            MIT,
            MIT-0,
            MPL-1.1,
            MPL-2.0,
            OFL-1.1,
            PSF-2.0,
            Python-2.0,
            Unlicense,
            WTFPL,
            Zlib
          # Reviewed exceptions, by package (security/known-advisories.md § Dependency review):
          #  - typing-extensions is PSF-2.0 (its own license_expression); GitHub's detector reads the PSF
          #    licence file's history section and reports GPL-1.0-or-later.
          #  - libvips behind sharp (LGPL-3.0-or-later, and the win32/wasm builds that bundle it) is left in
          #    two npm locks: the terminal's (its build stage installs it, its runtime tree removes it) and
          #    the retiring dashboard's, whose image optimizer uses it (license-exceptions.json,
          #    security/known-advisories.md). The pnpm tree loads core/meetings/modules/no-image-backend.
          #  - json-schema 0.4.0 (the dashboard, via @ai-sdk/provider) declares "(AFL-2.1 OR BSD-3-Clause)"
          #    and is taken under BSD-3-Clause; GitHub's detector reads its licence files as AND.
          allow-dependencies-licenses: >-
            pkg:pypi/typing-extensions,
            pkg:npm/%40img/sharp-libvips-darwin-arm64,
            pkg:npm/%40img/sharp-libvips-darwin-x64,
            pkg:npm/%40img/sharp-libvips-linux-arm,
            pkg:npm/%40img/sharp-libvips-linux-arm64,
            pkg:npm/%40img/sharp-libvips-linux-ppc64,
            pkg:npm/%40img/sharp-libvips-linux-riscv64,
            pkg:npm/%40img/sharp-libvips-linux-s390x,
            pkg:npm/%40img/sharp-libvips-linux-x64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-x64,
            pkg:npm/%40img/sharp-wasm32,
            pkg:npm/%40img/sharp-win32-arm64,
            pkg:npm/%40img/sharp-win32-ia32,
            pkg:npm/%40img/sharp-win32-x64,
            pkg:npm/json-schema
