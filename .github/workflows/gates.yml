name: gates
# push+pull_request unrestricted ran the suite TWICE per PR-branch push (both events
# fire) — pure duplication. Push covers main + release tags; pull_request covers PRs.
#
# SPLIT INTO 3 PARALLEL JOBS (wall-clock law): static / python / node run concurrently
# (~5 min serial → ~2.5 min), joined by the `gates` job — the ONE required-check context
# branch protection and the merge queue watch. The join fails if ANY leg is not success
# (if:always() + explicit check, because a skipped required check would read as satisfied).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # merge queue: the queue's temporary merge-group ref must run (and report) `gates`,
  # or every queued PR waits forever on a check that never fires.
  merge_group:

permissions:
  contents: read

# a superseded run's result is worthless — cancel it
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 — version comes from package.json "packageManager"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm } # pnpm 11.7 requires Node >= 22.13
      # The `gate script tests` step below drives gate:python over its own planted fixture packages,
      # and that gate shells out to `uv run pytest`. With no uv on this job every planted package
      # died on `/bin/sh: 1: uv: not found` — the vacuity control included, so the four rows that
      # give the F209 loop fix its meaning proved nothing and said so, on every run this branch has
      # ever had (Vexa-ai/vexa#1625). A stub uv would be worse than none: those rows exist to prove
      # the gate tells a passing pytest from a failing one, the one distinction a stub cannot make.
      # Same action and pin as the `python` job; seconds here, because the fixture tree is two
      # one-test packages rather than the checkout's sixteen.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: pnpm install --frozen-lockfile
        env: { ONNXRUNTIME_NODE_INSTALL: skip }
      # each gate its own step so a failure is unambiguous
      - run: pnpm gate:readme
      - run: pnpm gate:docs-version
      - run: pnpm gate:isolation
      - run: pnpm gate:exports
      - run: pnpm gate:graph
      - run: pnpm gate:schema
      - run: pnpm gate:contract-version
      - run: pnpm gate:config-contract
      - run: pnpm gate:domain-doors
      - run: pnpm gate:fact-parity
      - run: pnpm gate:vendor-payload
      - run: pnpm gate:db-schema
      - run: pnpm gate:db-budget
      - run: pnpm gate:dataflow
      - run: pnpm gate:calm
      - run: pnpm gate:licenses
      - run: pnpm gate:ui-design
      # The rest of the static set. Each is offline and takes about a second; before this they ran
      # only in the pre-push hook (which a worker may not have) or nowhere at all.
      - run: node scripts/gates.mjs isolation-py
      - run: node scripts/gates.mjs graph-py
      - run: node scripts/gates.mjs test-isolation
      # Also fails when docs/docs/governance/arch-compliance.mdx is not what the tree renders now:
      # regenerate it with `node scripts/arch-report.mjs` in the change that moved its evidence.
      - run: node scripts/gates.mjs arch-report
      - run: node scripts/gates.mjs eval
      - run: node scripts/gates.mjs eval-baseline
      - run: pnpm gate:image-licenses
      - run: pnpm gate:runtime-parity
      - run: node scripts/gates.mjs execution-env
      - run: node scripts/gates.mjs lite-makefile
      # The Helm chart's fences: the NetworkPolicies, which workloads hold which token, the broker's
      # key split. They render offline (`helm template`, no cluster). They used to run only in
      # release-images.yml, at tag push, after a PR that broke one had already merged.
      # test_template.sh prints SKIP and exits 0 when helm is absent, so the step first proves helm is
      # on the runner: a fence test that silently skips reads as a green one.
      - name: helm static gates (lint + template assertions)
        run: |
          command -v helm >/dev/null 2>&1 || { echo "::error ::helm is not on this runner, so the chart's fence tests would SKIP"; exit 1; }
          helm version --short
          bash deploy/helm/tests/test_helm_lint.sh
          bash deploy/helm/tests/test_template.sh
      # Tests OF the gate scripts (the instruments the steps above trust). scripts/ is not a
      # workspace package, so `pnpm test` — turbo run test — never reaches it: this step is the
      # only lane these files run in. Kept here, beside the gates they cover, rather than in the
      # node job, whose install/build cost buys them nothing.
      - name: gate script tests
        run: node --test scripts/*.test.mjs release/*.test.mjs

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: pnpm install --frozen-lockfile
        env: { ONNXRUNTIME_NODE_INSTALL: skip }
      # the runtime docker-backend lifecycle test creates containers via the docker socket API,
      # which (unlike `docker run`) does NOT implicit-pull — pre-pull its fixture image
      - run: docker pull alpine
      - run: pnpm gate:python

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      # CI runners have no GPU: skip onnxruntime-node's postinstall CUDA EP download — it is
      # large, raced across the two resolved onnxruntime versions, and flaked main's first run
      # (ENOENT in /tmp cleanup). The CPU binaries tests use are bundled in the package itself.
      - run: pnpm install --frozen-lockfile
        env: { ONNXRUNTIME_NODE_INSTALL: skip }
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  # THE required check — branch protection + merge queue watch this single context.
  gates:
    needs: [static, python, node]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All legs green?
        env:
          R_STATIC: ${{ needs.static.result }}
          R_PYTHON: ${{ needs.python.result }}
          R_NODE: ${{ needs.node.result }}
        run: |
          echo "static=$R_STATIC python=$R_PYTHON node=$R_NODE"
          [ "$R_STATIC" = "success" ] && [ "$R_PYTHON" = "success" ] && [ "$R_NODE" = "success" ] \
            || { echo "::error ::a gates leg failed or was cancelled"; exit 1; }
          echo "✓ all gate legs green"
